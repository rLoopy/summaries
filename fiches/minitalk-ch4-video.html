<script>
function shelf(bits, opts) {
  opts = opts || {};
  const masked = opts.masked || [];
  const kept = opts.kept || [];
  const active = opts.active || [];
  const fresh = opts.fresh || [];
  const showLabels = opts.labels !== false;
  const showWeights = opts.weights || false;
  let h = '<div class="shelf">';
  if (showWeights) {
    h += '<div class="weights"><span>128</span><span>64</span><span>32</span><span>16</span><span>8</span><span>4</span><span>2</span><span>1</span></div>';
  }
  h += '<div class="shelf-row">';
  bits.forEach((b, i) => {
    let cls = 'cell ' + (b === '0' ? 'zero' : b === '1' ? 'one' : '');
    if (fresh.includes(i)) cls += ' fresh';
    if (masked.includes(i)) cls += ' masked';
    if (kept.includes(i)) cls += ' kept';
    if (active.includes(i)) cls += ' active';
    h += '<div class="' + cls + '">' + b + '</div>';
  });
  h += '</div>';
  if (showLabels) {
    h += '<div class="labels"><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span><span>0</span></div>';
  }
  h += '</div>';
  return h;
}
function bitRow(bits, type) {
  let h = '<div class="bin-row">';
  bits.forEach(b => {
    h += '<div class="bin-cell ' + (type || (b === '0' ? 'zero' : 'one')) + '">' + b + '</div>';
  });
  h += '</div>';
  return h;
}
</script>

      c.innerHTML = 'L opérateur <code>&gt;&gt;</code> décale tous les bits d un nombre vers la droite. Le bit qui sort à droite est perdu. À gauche, un 0 entre. <b>C est l outil de base pour extraire les bits côté client.</b>';

    }
  },
  { tag: '§ 4.2 — shift gauche <<', title: 'c << 1 — décalage d une position', subtitle: 'avant / après', dur: 6500,
    render: (s, c) => {
      s.innerHTML = '<div class="big" style="font-size:18px; color:#5c5a75;">avant (c = 10) :</div>' + shelf(['0','0','0','0','1','0','1','0']) + '<div style="font-size:28px; color:#c9a6ff;">↓ décale d 1 cran à gauche ↓</div><div class="big" style="font-size:18px; color:#5c5a75;">après (c &lt;&lt; 1 = 20) :</div>' + shelf(['0','0','0','1','0','1','0','0'], { fresh: [7] });
      c.innerHTML = 'Tous les bits glissent vers la gauche. À droite, un <span style="color:#c9a6ff;">0 tout neuf</span> apparaît — c est cette nouvelle case libre qui sert à recevoir le prochain bit dans la reconstruction.<span class="why">Mathématiquement = multiplier par 2. 10 × 2 = 20.</span>';

<script>

    render: (s, c) => {

<script>
SCENES.push(

<script>
let currentScene = 0, timer = null, paused = false, startTime = 0, remainingTime = 0, playDelay = 3000;
const titleEl = document.getElementById('title');
const subEl = document.getElementById('subtitle');
const tagEl = document.getElementById('section-tag');
const stageEl = document.getElementById('stage');
const captionEl = document.getElementById('caption');
const progressEl = document.getElementById('progress');
function playScene(idx) {
  if (idx >= SCENES.length) idx = 0;
  if (idx < 0) idx = SCENES.length - 1;
  currentScene = idx;
  const s = SCENES[idx];
  titleEl.classList.remove('in');
  captionEl.classList.remove('in');
  setTimeout(() => {
    tagEl.textContent = s.tag;
    titleEl.textContent = s.title;
    subEl.textContent = s.subtitle || '';
    s.render(stageEl, captionEl);
    setTimeout(() => { titleEl.classList.add('in'); setTimeout(() => captionEl.classList.add('in'), 200); }, 80);
    document.getElementById('step-cur').textContent = idx + 1;
    document.getElementById('step-total').textContent = SCENES.length;
    progressEl.style.width = ((idx + 1) / SCENES.length * 100) + '%';
    startTime = Date.now();
    remainingTime = s.dur;
    if (!paused) scheduleNext(s.dur);
  }, 350);
}
function scheduleNext(d) { if (timer) clearTimeout(timer); timer = setTimeout(() => playScene(currentScene + 1), d); }
function togglePlay() {
  paused = !paused;
  document.getElementById('btn-play').textContent = paused ? 'reprendre' : 'pause';
  if (paused) { if (timer) clearTimeout(timer); remainingTime -= (Date.now() - startTime); }
  else { startTime = Date.now(); scheduleNext(Math.max(remainingTime, 500)); }
}
function replay() { paused = false; document.getElementById('btn-play').textContent = 'pause'; if (timer) clearTimeout(timer); playScene(0); }
function prev() { if (timer) clearTimeout(timer); playScene(currentScene - 1); }
function next() { if (timer) clearTimeout(timer); playScene(currentScene + 1); }
document.getElementById('btn-play').addEventListener('click', togglePlay);
document.getElementById('btn-replay').addEventListener('click', replay);
document.getElementById('btn-prev').addEventListener('click', prev);
document.getElementById('btn-next').addEventListener('click', next);
document.getElementById('speed').addEventListener('input', e => {
  playDelay = parseInt(e.target.value);
  document.getElementById('speed-val').textContent = (playDelay / 1000).toFixed(1) + 's';
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); prev(); }
  if (e.code === 'ArrowRight') { e.preventDefault(); next(); }
  if (e.code === 'KeyR') { e.preventDefault(); replay(); }
});
playScene(0);
</script>
