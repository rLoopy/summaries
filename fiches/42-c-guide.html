<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>42 C Guide — Exam Rank 02 · Level 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a12;--bg2:#0e0e18;--card:#12121e;--card2:#161625;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);
  --text:#e5e7eb;--muted:#9ca3af;--dim:#6b7280;--dark:#374151;
  --cyan:#06b6d4;--cyan2:#22d3ee;--cyan-bg:rgba(6,182,212,.08);--cyan-border:rgba(6,182,212,.25);
  --purple:#8b5cf6;--purple-bg:rgba(139,92,246,.08);--purple-border:rgba(139,92,246,.25);
  --green:#22c55e;--green-l:#86efac;--green-bg:rgba(34,197,94,.08);--green-border:rgba(34,197,94,.25);
  --red:#ef4444;--red-l:#fca5a5;--red-bg:rgba(239,68,68,.06);--red-border:rgba(239,68,68,.2);
  --orange:#fb923c;--yellow:#fbbf24;--gold:#e8a838;--gold-bg:rgba(232,168,56,.07);--gold-border:rgba(232,168,56,.2);
  --radius:12px;--radius-lg:16px;
}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
code,pre,.mono{font-family:'JetBrains Mono',monospace}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
#progress-bar{position:fixed;top:0;left:0;height:3px;width:0%;background:linear-gradient(90deg,var(--cyan),var(--purple));z-index:9999;transition:width .3s ease;border-radius:0 2px 2px 0}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;z-index:100;transition:transform .3s ease}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border)}
.sidebar-title{font-size:15px;font-weight:800;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px}
.sidebar-sub{font-size:11px;color:var(--dim);margin-top:2px;font-weight:500}
.sidebar-progress{margin-top:14px}
.progress-bar-bg{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.progress-label{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px;color:var(--dim)}
.progress-pct{font-weight:700;color:var(--cyan);font-size:13px}
.xp-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;background:var(--gold-bg);border:1px solid var(--gold-border);font-size:11px;font-weight:700;color:var(--gold)}
.sidebar-nav{padding:8px 12px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .15s;font-size:13px;font-weight:500;color:var(--muted);border:1px solid transparent;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-item.active{background:var(--cyan-bg);border-color:var(--cyan-border);color:var(--cyan2)}
.nav-item.locked{opacity:.35;cursor:not-allowed}
.nav-item.completed{color:var(--green-l)}
.nav-icon{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-weight:700}
.nav-icon.locked{background:rgba(255,255,255,.04);color:var(--dim)}
.nav-icon.available{background:var(--cyan-bg);border:1px solid var(--cyan-border);color:var(--cyan)}
.nav-icon.quiz-done{background:var(--purple-bg);border:1px solid var(--purple-border);color:var(--purple)}
.nav-icon.complete{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)}
.main{margin-left:280px;min-height:100vh;padding:32px 40px 80px}
.main-inner{max-width:820px;margin:0 auto}
.tabs{display:flex;gap:4px;padding:4px;background:var(--card);border-radius:10px;margin-bottom:24px;border:1px solid var(--border);flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:6px;background:transparent;color:var(--dim)}
.tab:hover{color:var(--muted);background:rgba(255,255,255,.03)}
.tab.active{background:var(--cyan-bg);color:var(--cyan2);font-weight:600}
.ex-header{margin-bottom:24px}
.ex-cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.ex-title{font-size:28px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,var(--text),var(--muted));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ex-num{font-size:13px;color:var(--dim);margin-top:4px}
.theory-section{margin-bottom:28px}
.theory-step{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.theory-step-num{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--cyan),var(--purple));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.theory-step-title{font-size:17px;font-weight:700;color:var(--text)}
.theory-text{font-size:13.5px;color:var(--muted);line-height:1.75;white-space:pre-line;margin-bottom:14px}
.box-tip{background:var(--cyan-bg);border:1px solid var(--cyan-border);padding:16px 20px;border-radius:var(--radius);margin:16px 0}
.box-tip p{color:var(--cyan2);font-size:13px;margin:0}
.code-block{border-radius:10px;overflow:hidden;border:1px solid var(--border);margin:14px 0;background:#08080f}
.code-header{display:flex;align-items:center;gap:6px;padding:8px 14px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--border)}
.code-dot{width:8px;height:8px;border-radius:50%}
.code-filename{margin-left:8px;font-size:11px;color:var(--dim);font-family:'JetBrains Mono',monospace}
.code-block pre{margin:0;padding:14px 18px;overflow-x:auto;font-size:12.5px;line-height:1.7;font-family:'JetBrains Mono',monospace;color:#d1d5db;tab-size:4}
.subject-box{background:#08080f;border:1px solid var(--cyan-border);border-radius:var(--radius);padding:18px 22px;margin:14px 0}
.subject-label{font-size:11px;font-weight:700;color:var(--cyan);letter-spacing:1.5px;margin-bottom:10px;font-family:'JetBrains Mono',monospace}
.subject-text{font-size:12.5px;line-height:1.7;color:var(--muted);font-family:'JetBrains Mono',monospace;white-space:pre-wrap}
.walk-item{display:flex;gap:12px;margin-bottom:10px;align-items:flex-start}
.walk-code{font-size:11px;color:var(--purple);font-family:'JetBrains Mono',monospace;flex-shrink:0;background:var(--purple-bg);padding:4px 10px;border-radius:5px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.walk-explain{font-size:13px;color:var(--muted);line-height:1.6}
.test-table{background:#08080f;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.test-row{display:flex;padding:8px 16px;gap:12px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.test-row:last-child{border-bottom:none}
.test-input{font-size:11.5px;color:var(--dim);font-family:'JetBrains Mono',monospace}
.test-output{font-size:11.5px;color:var(--green-l);font-family:'JetBrains Mono',monospace}
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;transition:border-color .2s}
.quiz-q{color:var(--text);font-size:14px;font-weight:500;margin-bottom:12px}
.quiz-opt{display:block;width:100%;text-align:left;padding:9px 14px;margin-bottom:4px;border-radius:7px;font-size:13px;font-family:inherit;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:transparent;color:var(--muted)}
.quiz-opt:hover{background:rgba(255,255,255,.03);color:var(--text)}
.quiz-opt.selected{border-color:var(--cyan-border);background:var(--cyan-bg);color:var(--cyan2)}
.quiz-opt.correct{border-color:var(--green-border);background:var(--green-bg);color:var(--green-l)}
.quiz-opt.wrong{border-color:var(--red-border);background:var(--red-bg);color:var(--red-l)}
.quiz-ex{margin-top:8px;font-size:12px;line-height:1.5}
.editor-wrap{position:relative;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#08080f}
.editor-lines{position:absolute;left:0;top:0;bottom:0;width:40px;background:rgba(255,255,255,.02);border-right:1px solid var(--border);padding:14px 0;text-align:right;pointer-events:none;overflow:hidden}
.editor-line-num{display:block;padding:0 8px 0 0;font-size:12px;line-height:1.7;color:rgba(255,255,255,.15);font-family:'JetBrains Mono',monospace}
.editor-textarea{width:100%;min-height:300px;padding:14px 18px 14px 52px;background:transparent;border:none;resize:vertical;font-size:12.5px;line-height:1.7;font-family:'JetBrains Mono',monospace;color:#d1d5db;tab-size:4;outline:none;caret-color:var(--cyan)}
.check-result{display:flex;gap:8px;align-items:center;margin-bottom:4px;font-size:13px}
.check-pass{color:var(--green-l)}
.check-fail{color:var(--red-l)}
.btn{padding:10px 24px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-secondary{background:transparent;border:1px solid var(--border2);color:var(--muted)}
.btn-secondary:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-bottom{display:flex;justify-content:space-between;margin-top:36px;padding-top:20px;border-top:1px solid var(--border)}
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:200;width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--border);cursor:pointer;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:20px 16px 80px}
  .hamburger{display:flex}
  .overlay.open{display:block}
  .ex-title{font-size:22px}
  .tabs{gap:2px}
  .tab{padding:6px 10px;font-size:12px}
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease forwards}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.slide-up{animation:slideUp .4s ease forwards}
</style>
</head>

<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;
const EX=[
{id:"ft_putstr",title:"ft_putstr",cat:"function",level:1,xp:100,theory:[{title:"write() \u2014 Ta seule fa\u00e7on d'afficher",text:"À 42, on n'utilise pas printf. On utilise write(), une fonction système qui écrit des octets bruts.\n\nSa signature : write(fd, buffer, count)\n\u2022 fd = 1 (la sortie standard, ton terminal)\n\u2022 buffer = un pointeur vers les données à écrire\n\u2022 count = combien d'octets écrire\n\nPour afficher une lettre stockée dans une variable char :",code:"#include <unistd.h>  // Nécessaire pour write()\n\nchar c = 'A';\nwrite(1, &c, 1);   // &c = \"l'adresse de c\"\n                    // write veut une ADRESSE, pas la valeur"},{title:"Les strings en C et le '\\0'",text:"Une string en C est une suite de caractères en mémoire, terminée par un caractère spécial : '\\0' (valeur 0).\n\n\"Hello\" en mémoire : [H][e][l][l][o][\\0]\n\nOn accède aux caractères avec str[i] :\n\u2022 str[0] = 'H'\n\u2022 str[4] = 'o'\n\u2022 str[5] = '\\0' (la fin)\n\n'\\0' vaut 0, et 0 est \"faux\" en C. Donc while(str[i]) s'arrête pile au bon moment.",code:"char *str = \"Hello\";\n\n// str[0] = 'H'   (72 en ASCII)\n// str[1] = 'e'   (101)\n// str[5] = '\\0'  (0 \u2014 fin de string)",svg:"memory"},{title:"La boucle while \u2014 Parcourir une string",text:"Le pattern fondamental que tu utiliseras dans 90% des exercices :\n\n1. Un index i à 0\n2. Tant que str[i] n'est pas '\\0' \u2192 faire quelque chose\n3. Incrémenter i\n\nC'est tout. Ce pattern parcourt chaque caractère un par un.",code:"int i = 0;\n\nwhile (str[i])           // Tant que pas \\0\n{\n\twrite(1, &str[i], 1); // Affiche le char à l'index i\n\ti++;                  // Passe au suivant\n}\n// Quand str[i] == '\\0', on sort de la boucle"},{title:"Pourquoi &str[i] et pas str[i] ?",text:"C'est LA question que tout le monde se pose. Comprendre ça, c'est comprendre les pointeurs.\n\nImagine la mémoire comme un immeuble :\n\u2022 Chaque appartement a un NUMÉRO (= l'adresse, ex: 0x7A)\n\u2022 Chaque appartement contient quelque chose (= la valeur, ex: 'H')\n\nstr[i] = la VALEUR dans l'appartement \u2192 'H' (72 en nombre)\n&str[i] = le NUMÉRO de l'appartement \u2192 0x7A (une adresse)\n\nwrite() est comme un livreur : il a besoin de l'ADRESSE pour savoir OÙ aller lire.",code:"char *str = \"Hello\";\n\nstr[0]     // \u2192 'H'  (la valeur : 72)\n&str[0]    // \u2192 0x7A (l'adresse où vit 'H')\n\nwrite(1, &str[0], 1);  // \u2713 \"va à l'adresse 0x7A, lis 1 octet\"\nwrite(1, str[0], 1);   // \u2717 \"va à l'adresse 72\" \u2192 CRASH",svg:"pointer"},{title:"& résumé \u2014 La règle simple",text:"L'opérateur & signifie \"donne-moi l'adresse de cette variable\".\n\nRetiens cette règle :\n\u2022 Si une fonction attend un POINTEUR (une adresse) \u2192 utilise &\n\u2022 write() attend un pointeur en 2ème argument \u2192 &str[i] ou &c\n\nstr sans crochets = déjà un pointeur (pas besoin de &)\nstr[i] avec crochets = une valeur (il faut & pour retrouver l'adresse)",code:"char c = 'X';\nchar *str = \"Hello\";\n\nwrite(1, &c, 1);         // \u2713 c est une valeur\nwrite(1, str, 5);         // \u2713 str est déjà un pointeur\nwrite(1, &str[0], 1);    // \u2713 str[i] est une valeur\nwrite(1, str + 2, 1);    // \u2713 même chose que &str[2]"}],subject:"void ft_putstr(char *str);\nAllowed functions: write\nAffiche une string sur la sortie standard.",solution:"#include <unistd.h>\n\nvoid\tft_putstr(char *str)\n{\n\tint\ti;\n\n\ti = 0;\n\twhile (str[i])\n\t{\n\t\twrite(1, &str[i], 1);\n\t\ti++;\n\t}\n}",walk:[{l:"void",e:"Pas de return \u2014 la fonction affiche, c'est tout."},{l:"while (str[i])",e:"Parcourt jusqu'au \\0. str[i] vaut 0 (faux) au \\0."},{l:"&str[i]",e:"write veut une adresse. &str[i] = adresse du char à l'index i."}],pitfalls:["Oublier le & devant str[i] dans write","Ajouter un \\n non demandé","Oublier #include <unistd.h>"],tests:[{i:'ft_putstr("Hello")',o:"Hello"},{i:'ft_putstr("")',o:"(rien)"}],quiz:[{q:"Pourquoi &str[i] et pas str[i] dans write ?",opts:["C'est pareil","write attend une adresse, pas la valeur elle-même","& est optionnel"],correct:1,ex:"str[i] = la valeur ('H' = 72). &str[i] = l'adresse. write a besoin de l'adresse."},{q:'Si char *str = "Hi"; est-ce que write(1, str, 2) est valide ?',opts:["Non, il faut &str","Oui, str est déjà un pointeur"],correct:1,ex:"str est un char * \u2014 c'est déjà une adresse."},{q:'Que fait ft_putstr("") ?',opts:["Affiche un espace","Ne fait rien","Segfault"],correct:1,ex:"str[0] = \\0 \u2192 la boucle ne s'exécute pas."},{q:"Faut-il un \\n à la fin ?",opts:["Oui","Non, le sujet ne le demande pas"],correct:1,ex:"Le sujet dit juste 'displays a string'."}],starter:"#include <unistd.h>\n\nvoid\tft_putstr(char *str)\n{\n\t// Parcours str, affiche chaque char\n}",checks:[{p:"while",m:"Boucle while"},{p:"&str[",m:"&str[i] pour write"},{p:"write",m:"write()"}]},
{id:"ft_strlen",title:"ft_strlen",cat:"function",level:1,xp:100,theory:[{title:"Fonctions qui retournent une valeur",text:"Une fonction peut retourner une valeur avec return. Le type de retour est indiqué avant le nom :\n\n\u2022 void ft_putstr(...) \u2192 ne retourne rien\n\u2022 int ft_strlen(...) \u2192 retourne un nombre entier\n\nLe mot-clé return fait deux choses :\n1. Il donne la valeur au code qui a appelé la fonction\n2. Il quitte la fonction immédiatement",code:"int\tft_add(int a, int b)\n{\n\treturn (a + b);  // Retourne la somme\n}\n\nint result = ft_add(20, 22);  // result = 42"},{title:"Le pattern : compter au lieu d'afficher",text:"ft_strlen utilise exactement le même pattern que ft_putstr, mais au lieu d'afficher chaque caractère, on COMPTE combien il y en a.\n\nLe compteur i commence à 0 et s'incrémente à chaque caractère. Quand on atteint \\0, i contient le nombre de caractères = la longueur.",code:"// ft_putstr : while(str[i]) \u2192 AFFICHE\n// ft_strlen : while(str[i]) \u2192 COMPTE\n\nint i = 0;\nwhile (str[i])\n\ti++;\nreturn (i);      // i = longueur"}],subject:"int ft_strlen(char *str);\nAllowed functions: None\nRetourne la longueur d'une string.",solution:"int\tft_strlen(char *str)\n{\n\tint\ti;\n\n\ti = 0;\n\twhile (str[i])\n\t\ti++;\n\treturn (i);\n}",walk:[{l:"i = 0",e:"Commence au 1er char."},{l:"while (str[i])",e:"Avance tant que pas \\0."},{l:"return (i)",e:"i = nombre de chars parcourus."}],pitfalls:["Oublier i = 0","Retourner i + 1 par erreur","Ajouter un main() non demandé"],tests:[{i:'ft_strlen("Hello")',o:"5"},{i:'ft_strlen("")',o:"0"},{i:'ft_strlen("42")',o:"2"}],quiz:[{q:'ft_strlen("") retourne ?',opts:["1","0","-1"],correct:1,ex:"str[0] = \\0 \u2192 boucle skip \u2192 i = 0."},{q:"Le \\0 est-il compté ?",opts:["Oui","Non"],correct:1,ex:"Le \\0 stoppe la boucle, il n'est pas compté."}],starter:"int\tft_strlen(char *str)\n{\n\t// Compte les chars jusqu'au \\0\n}",checks:[{p:"while",m:"Boucle while"},{p:"return",m:"Retourne i"},{p:"= 0",m:"Init i = 0"}]},
{id:"ft_strcpy",title:"ft_strcpy",cat:"function",level:1,xp:100,theory:[{title:"Copier = lire + écrire en même temps",text:"ft_strcpy copie une string source dans une destination. Le pattern est le même parcours while(str[i]), mais à chaque tour on ÉCRIT dans la destination :\n\ndest[i] = src[i]\n\nC'est comme recopier un texte lettre par lettre.",code:"while (src[i])\n{\n\tdest[i] = src[i];  // Copie le char\n\ti++;\n}"},{title:"Le '\\0' final \u2014 NE JAMAIS OUBLIER",text:"Après la boucle, on a copié tous les caractères SAUF le \\0. Il faut MANUELLEMENT ajouter dest[i] = '\\0' après la boucle.\n\nC'est l'erreur n°1 en C : oublier le null terminator.",code:"while (src[i])\n{\n\tdest[i] = src[i];\n\ti++;\n}\ndest[i] = '\\0';  // \u2190 CRUCIAL"},{title:"Retourner dest (convention strcpy)",text:"La vraie strcpy retourne un pointeur vers la destination. On fait pareil : return (dest).\n\nLe prototype est char * (pointeur vers char), pas void.",code:"char\t*ft_strcpy(char *dest, char *src)\n{\n\t// ... copie ...\n\treturn (dest);\n}"}],subject:"char *ft_strcpy(char *s1, char *s2);\nAllowed functions: None\nReproduit le comportement de strcpy. s1 = dest, s2 = src.",solution:"char\t*ft_strcpy(char *s1, char *s2)\n{\n\tint\ti;\n\n\ti = 0;\n\twhile (s2[i])\n\t{\n\t\ts1[i] = s2[i];\n\t\ti++;\n\t}\n\ts1[i] = '\\0';\n\treturn (s1);\n}",walk:[{l:"while (s2[i])",e:"Parcourt la source."},{l:"s1[i] = s2[i]",e:"Copie char par char."},{l:"s1[i] = '\\0'",e:"Ajoute le null terminator après la boucle."},{l:"return (s1)",e:"Retourne la destination."}],pitfalls:["Oublier s1[i] = '\\0' \u2014 erreur n°1 en C","Inverser source et dest","Ne pas retourner s1"],tests:[{i:'ft_strcpy(d, "Hello")',o:'"Hello"'},{i:'ft_strcpy(d, "")',o:'""'}],quiz:[{q:"Que se passe-t-il sans le \\0 final ?",opts:["Rien","Des déchets après les chars copiés","Segfault"],correct:1,ex:"Sans \\0, la string n'a pas de fin."},{q:'Si s2 = "", la boucle tourne combien de fois ?',opts:["1","0","Erreur"],correct:1,ex:"s2[0] = \\0 \u2192 0 tours. Puis s1[0] = '\\0'."}],starter:"char\t*ft_strcpy(char *s1, char *s2)\n{\n\t// Copie s2 dans s1, ajoute \\0, retourne s1\n}",checks:[{p:"while",m:"Boucle while"},{p:"s1[",m:"Écris dans s1"},{p:"'\\0'",m:"Ajoute \\0"},{p:"return",m:"Retourne s1"}]},
{id:"ft_swap",title:"ft_swap",cat:"pointer",level:1,xp:120,theory:[{title:"Le problème : C copie les arguments",text:"En C, quand tu passes une variable à une fonction, elle reçoit une COPIE. Modifier la copie ne change pas l'original.\n\nC'est comme photocopier un document : gribouiller sur la copie ne change pas l'original.",code:"void bad_swap(int a, int b)\n{\n\tint tmp = a;\n\ta = b;     // Modifie la COPIE de a\n\tb = tmp;   // Modifie la COPIE de b\n}\n// Après l'appel, les originaux n'ont PAS changé !"},{title:"La solution : les pointeurs",text:"Un pointeur est une variable qui contient une ADRESSE mémoire.\n\n\u2022 int *p  \u2192 p est un pointeur vers un int\n\u2022 &x     \u2192 \"l'adresse de x\"\n\u2022 *p     \u2192 \"la valeur à l'adresse p\"\n\nC'est comme donner l'adresse d'une maison au lieu d'une photo.",code:"int x = 42;\nint *p = &x;   // p contient l'adresse de x\n\n// *p == x == 42\n\n*p = 100;      // Change la valeur À L'ADRESSE de p\n// Maintenant x == 100 !",svg:"pointer"},{title:"ft_swap : échanger via pointeurs",text:"On passe les ADRESSES à la fonction. Elle utilise * pour modifier les valeurs originales.\n\n1. tmp = *a (sauvegarde la valeur de a)\n2. *a = *b (a prend la valeur de b)\n3. *b = tmp (b prend l'ancienne valeur de a)\n\n3 lignes, c'est tout.",code:"int x = 1, y = 2;\nft_swap(&x, &y);    // On passe les ADRESSES\n// Maintenant x == 2, y == 1"}],subject:"void ft_swap(int *a, int *b);\nAllowed functions: None\nÉchange les valeurs de deux int.",solution:"void\tft_swap(int *a, int *b)\n{\n\tint\ttmp;\n\n\ttmp = *a;\n\t*a = *b;\n\t*b = tmp;\n}",walk:[{l:"int tmp",e:"Variable temporaire \u2014 un simple int, PAS un pointeur."},{l:"tmp = *a",e:"Sauvegarde la valeur pointée par a."},{l:"*a = *b",e:"La valeur à l'adresse a \u2190 valeur à l'adresse b."},{l:"*b = tmp",e:"La valeur à l'adresse b \u2190 ancienne valeur de a."}],pitfalls:["a = b au lieu de *a = *b","Oublier tmp \u2192 on perd une valeur","int *tmp au lieu de int tmp"],tests:[{i:"x=1,y=2 \u2192 ft_swap(&x,&y)",o:"x=2, y=1"},{i:"x=-5,y=42",o:"x=42, y=-5"}],quiz:[{q:"Pourquoi int *a et pas int a ?",opts:["Plus rapide","Pour modifier l'original, pas une copie"],correct:1,ex:"Sans pointeur, la fonction modifie des copies."},{q:"tmp est un int ou int * ?",opts:["int *","int"],correct:1,ex:"tmp stocke une valeur, pas une adresse."},{q:"Que se passe-t-il si on écrit a = b au lieu de *a = *b ?",opts:["Ça marche","On échange les adresses locales, pas les valeurs originales"],correct:1,ex:"Sans *, on modifie les copies locales des pointeurs."}],starter:"void\tft_swap(int *a, int *b)\n{\n\t// tmp = *a, *a = *b, *b = tmp\n}",checks:[{p:"tmp",m:"Variable tmp"},{p:"*a",m:"Déréférence *a"},{p:"*b",m:"Déréférence *b"}]},
{id:"first_word",title:"first_word",cat:"string",level:1,xp:120,theory:[{title:"argc et argv \u2014 Les arguments du programme",text:"Quand tu exécutes ./programme hello world :\n\n\u2022 argc = le nombre d'arguments (ici 3)\n\u2022 argv = un tableau de strings\n\nargv[0] = \"./programme\"\nargv[1] = \"hello\"\nargv[2] = \"world\"\n\nLa PREMIÈRE chose à faire : vérifier argc.",code:"int main(int argc, char **argv)\n{\n\tif (argc == 2)\n\t{\n\t\t// Travaille avec argv[1]\n\t}\n\twrite(1, \"\\n\", 1);\n\treturn (0);\n}"},{title:"Le pattern skip + print",text:"Deux phases :\n1. SKIP : avance tant que c'est un espace ou une tab\n2. PRINT : affiche tant que ce n'est PAS un espace/tab/fin\n\nC'est comme lire une phrase : tu ignores les espaces du début, puis tu lis jusqu'au prochain espace.",code:"// Phase 1 : SKIP\nwhile (argv[1][i] == ' ' || argv[1][i] == '\\t')\n\ti++;\n\n// Phase 2 : PRINT\nwhile (argv[1][i] && argv[1][i] != ' ' && argv[1][i] != '\\t')\n{\n\twrite(1, &argv[1][i], 1);\n\ti++;\n}"},{title:"Espaces ET tabs",text:"Le sujet dit \"delimited by spaces/tabs\". Il faut vérifier LES DEUX :\n\u2022 ' '  = espace (32)\n\u2022 '\\t' = tab (9)\n\nOublier les tabs est une erreur classique.",code:"// FAUX :\nwhile (argv[1][i] == ' ')\n\n// CORRECT :\nwhile (argv[1][i] == ' ' || argv[1][i] == '\\t')"}],subject:"first_word.c \u2014 Allowed: write\nAffiche le premier mot de argv[1] suivi de \\n.\nUn mot est délimité par des espaces/tabs.\nSi argc != 2 ou pas de mots \u2192 juste \\n.",solution:"#include <unistd.h>\n\nint\tmain(int argc, char **argv)\n{\n\tint\ti;\n\n\ti = 0;\n\tif (argc == 2)\n\t{\n\t\twhile (argv[1][i] == ' ' || argv[1][i] == '\\t')\n\t\t\ti++;\n\t\twhile (argv[1][i] && argv[1][i] != ' ' && argv[1][i] != '\\t')\n\t\t{\n\t\t\twrite(1, &argv[1][i], 1);\n\t\t\ti++;\n\t\t}\n\t}\n\twrite(1, \"\\n\", 1);\n\treturn (0);\n}",walk:[{l:"if (argc == 2)",e:"Pas 1 arg \u2192 direct au \\n."},{l:"== ' ' || == '\\t'",e:"Skip espaces ET tabs."},{l:"&& != ' ' && != '\\t'",e:"Print tant que pas espace/tab/fin."},{l:"write(\"\\n\") hors du if",e:"Le \\n s'affiche TOUJOURS."}],pitfalls:["Oublier les tabs","Mettre le \\n DANS le if","Oublier le check de \\0 dans la 2ème boucle"],tests:[{i:'"  hello world"',o:"hello"},{i:'"\\thello"',o:"hello"},{i:'"   "',o:"(\\n)"},{i:"(pas d'arg)",o:"(\\n)"}],quiz:[{q:"Faut-il gérer les tabs ?",opts:["Non","Oui, le sujet dit spaces/tabs"],correct:1,ex:"C'est explicite dans le sujet."},{q:"Où placer le \\n final ?",opts:["Dans le if","Après le if, toujours"],correct:1,ex:"Il doit s'afficher dans TOUS les cas."},{q:"argc == 2 ou argc == 1 ?",opts:["argc == 1","argc == 2 (programme = argv[0])"],correct:1,ex:"argv[0] = le programme. 1 arg utilisateur = argc 2."}],starter:"#include <unistd.h>\n\nint\tmain(int argc, char **argv)\n{\n\t// Skip espaces/tabs + print le mot\n\n\treturn (0);\n}",checks:[{p:"argc",m:"Vérifie argc"},{p:"' '",m:"Gère espaces"},{p:"'\\t'",m:"Gère tabs"},{p:"while",m:"Boucles while"}]},
{id:"ulstr",title:"ulstr",cat:"ascii",level:1,xp:100,theory:[{title:"ASCII \u2014 Chaque caractère est un nombre",text:"En C, un char est un petit nombre entier. La table ASCII :\n\n\u2022 '0'-'9' \u2192 48 à 57\n\u2022 'A'-'Z' \u2192 65 à 90\n\u2022 'a'-'z' \u2192 97 à 122\n\u2022 ' ' \u2192 32\n\nTu n'as pas besoin de mémoriser les nombres. Retiens juste qu'on peut comparer et faire de l'arithmétique avec les chars.",code:"char c = 'A';    // c vaut 65\nchar d = 'a';    // d vaut 97\n\nif (c >= 'A' && c <= 'Z')   // Majuscule ?\nif (c >= 'a' && c <= 'z')   // Minuscule ?\nif (c >= '0' && c <= '9')   // Chiffre ?"},{title:"La différence magique : 32",text:"La différence entre une majuscule et sa minuscule est TOUJOURS 32 :\n\n'a' - 'A' = 97 - 65 = 32\n\nDonc :\n\u2022 Majuscule \u2192 minuscule : c + 32\n\u2022 Minuscule \u2192 majuscule : c - 32\n\nATTENTION : vérifier que c'est bien une lettre d'abord !",code:"char c = 'H';\n\nif (c >= 'A' && c <= 'Z')\n\tc += 32;           // 'H' + 32 = 'h'\nif (c >= 'a' && c <= 'z')\n\tc -= 32;           // 'h' - 32 = 'H'"},{title:"Le pattern itérer-transformer",text:"ulstr parcourt la string, et pour chaque caractère :\n1. Minuscule \u2192 majuscule (-32)\n2. Majuscule \u2192 minuscule (+32)\n3. Sinon \u2192 tel quel\n\nMême parcours que ft_putstr, avec transformation au milieu.",code:"while (argv[1][i])\n{\n\tc = argv[1][i];\n\tif (c >= 'a' && c <= 'z')\n\t\tc -= 32;\n\telse if (c >= 'A' && c <= 'Z')\n\t\tc += 32;\n\twrite(1, &c, 1);\n\ti++;\n}"}],subject:"ulstr.c \u2014 Allowed: write\nInverse la casse de chaque lettre.\nSi argc != 2 \u2192 juste \\n.",solution:"#include <unistd.h>\n\nint\tmain(int argc, char **argv)\n{\n\tint\t\ti;\n\tchar\tc;\n\n\tif (argc == 2)\n\t{\n\t\ti = 0;\n\t\twhile (argv[1][i])\n\t\t{\n\t\t\tc = argv[1][i];\n\t\t\tif (c >= 'a' && c <= 'z')\n\t\t\t\tc -= 32;\n\t\t\telse if (c >= 'A' && c <= 'Z')\n\t\t\t\tc += 32;\n\t\t\twrite(1, &c, 1);\n\t\t\ti++;\n\t\t}\n\t}\n\twrite(1, \"\\n\", 1);\n\treturn (0);\n}",walk:[{l:"c = argv[1][i]",e:"Copie le char pour le modifier."},{l:"c -= 32",e:"Minuscule \u2192 majuscule."},{l:"c += 32",e:"Majuscule \u2192 minuscule."}],pitfalls:["Inverser +32 et -32","Transformer les non-lettres","Oublier de copier dans c"],tests:[{i:'"Hello World"',o:"hELLO wORLD"},{i:'"42 Cool"',o:"42 cOOL"}],quiz:[{q:"Différence ASCII entre 'B' et 'b' ?",opts:["26","32","64"],correct:1,ex:"98-66 = 32. Toujours."},{q:"Que devient '5' ?",opts:["'5'+32","'5' inchangé"],correct:1,ex:"Pas une lettre \u2192 pas de transformation."},{q:"c >= 'a' && c <= 'z' vérifie quoi ?",opts:["Si c est une voyelle","Si c est une minuscule","Si c est une lettre"],correct:1,ex:"Les minuscules vont de 'a'(97) à 'z'(122)."}],starter:"#include <unistd.h>\n\nint\tmain(int argc, char **argv)\n{\n\t// min \u2192 -32, MAJ \u2192 +32, sinon tel quel\n\n\treturn (0);\n}",checks:[{p:"32",m:"+32 ou -32"},{p:">= 'a'",m:"Check minuscule"},{p:">= 'A'",m:"Check majuscule"}]},
{id:"rev_print",title:"rev_print",cat:"string",level:1,xp:100,theory:[{title:"Parcourir à l'envers",text:"Phase 1 : trouver la fin \u2192 while(str[i]) i++ (comme ft_strlen)\nPhase 2 : reculer et afficher \u2192 i--, while(i >= 0) write + i--\n\nLe piège : après phase 1, i pointe sur '\\0', pas sur le dernier char. Il faut un i-- AVANT la phase 2.",code:"// Phase 1 : aller à la fin\ni = 0;\nwhile (str[i])\n\ti++;\n// i = 5 (pointe sur \\0)\n\ni--;    // i = 4 (dernier vrai char)\n\n// Phase 2 : reculer\nwhile (i >= 0)\n{\n\twrite(1, &str[i], 1);\n\ti--;\n}"},{title:">= 0, pas > 0 !",text:"while(i > 0) raterait le caractère à l'index 0. Il faut while(i >= 0).\n\nString vide : i=0 \u2192 i-- \u2192 i=-1 \u2192 boucle skip \u2192 OK.",code:"// FAUX : rate str[0]\nwhile (i > 0)\n\n// CORRECT : inclut str[0]\nwhile (i >= 0)"}],subject:"rev_print.c \u2014 Allowed: write\nAffiche la string à l'envers suivie de \\n.\nSi argc != 2 \u2192 juste \\n.",solution:"#include <unistd.h>\n\nint\tmain(int argc, char **argv)\n{\n\tint\ti;\n\n\tif (argc == 2)\n\t{\n\t\ti = 0;\n\t\twhile (argv[1][i])\n\t\t\ti++;\n\t\ti--;\n\t\twhile (i >= 0)\n\t\t{\n\t\t\twrite(1, &argv[1][i], 1);\n\t\t\ti--;\n\t\t}\n\t}\n\twrite(1, \"\\n\", 1);\n\treturn (0);\n}",walk:[{l:"while(str[i]) i++",e:"Trouve la fin."},{l:"i--",e:"Recule de \\0 au dernier char."},{l:"while (i >= 0)",e:"Affiche en reculant, y compris index 0."}],pitfalls:["Oublier i-- entre les phases","while(i > 0) rate str[0]"],tests:[{i:'"Hello"',o:"olleH"},{i:'"42"',o:"24"},{i:'""',o:"(\\n)"}],quiz:[{q:'str="AB", i après while(str[i]) i++ ?',opts:["1","2"],correct:1,ex:"str[2]='\\0' \u2192 i=2."},{q:"Pourquoi >= 0 et pas > 0 ?",opts:["C'est pareil","Pour inclure str[0]"],correct:1,ex:"Avec > 0, on rate le premier caractère."}],starter:"#include <unistd.h>\n\nint\tmain(int argc, char **argv)\n{\n\t// Aller à la fin, i--, reculer en affichant\n\n\treturn (0);\n}",checks:[{p:"i--",m:"i-- pour reculer"},{p:">= 0",m:"while (i >= 0)"},{p:"argc",m:"Vérifie argc"}]},
{id:"repeat_alpha",title:"repeat_alpha",cat:"string",level:1,xp:140,theory:[{title:"Position dans l'alphabet",text:"Chaque lettre a une position : a=1, b=2, ..., z=26.\n\n\u2022 Minuscule : c - 'a' + 1\n\u2022 Majuscule : c - 'A' + 1\n\nLe +1 est important : sans lui, 'a' donnerait 0 !",code:"'a' - 'a' + 1 = 1   // 'a' \u2192 1 fois\n'c' - 'a' + 1 = 3   // 'c' \u2192 3 fois\n'z' - 'a' + 1 = 26  // 'z' \u2192 26 fois"},{title:"Boucles imbriquées (double boucle)",text:"Pour chaque caractère, on doit l'afficher PLUSIEURS fois :\n\n\u2022 Boucle externe : parcourt la string (index i)\n\u2022 Boucle interne : répète le char (index j)\n\nLes non-lettres s'affichent 1 seule fois \u2192 repeat = 1 par défaut.",code:"while (str[i])\n{\n\trepeat = 1;\n\tif (is_lower) repeat = str[i] - 'a' + 1;\n\tif (is_upper) repeat = str[i] - 'A' + 1;\n\tj = 0;\n\twhile (j < repeat)\n\t{\n\t\twrite(1, &str[i], 1);\n\t\tj++;\n\t}\n\ti++;\n}"}],subject:"repeat_alpha.c \u2014 Allowed: write\nRépète chaque lettre selon sa position alphabétique.\n'a'\u2192'a', 'b'\u2192'bb', 'e'\u2192'eeeee'.\nSi argc != 2 \u2192 juste \\n.",solution:"#include <unistd.h>\n\nint\tmain(int argc, char **argv)\n{\n\tint\ti;\n\tint\trepeat;\n\tint\tj;\n\n\tif (argc == 2)\n\t{\n\t\ti = 0;\n\t\twhile (argv[1][i])\n\t\t{\n\t\t\trepeat = 1;\n\t\t\tif (argv[1][i] >= 'a' && argv[1][i] <= 'z')\n\t\t\t\trepeat = argv[1][i] - 'a' + 1;\n\t\t\telse if (argv[1][i] >= 'A' && argv[1][i] <= 'Z')\n\t\t\t\trepeat = argv[1][i] - 'A' + 1;\n\t\t\tj = 0;\n\t\t\twhile (j < repeat)\n\t\t\t{\n\t\t\t\twrite(1, &argv[1][i], 1);\n\t\t\t\tj++;\n\t\t\t}\n\t\t\ti++;\n\t\t}\n\t}\n\twrite(1, \"\\n\", 1);\n\treturn (0);\n}",walk:[{l:"repeat = 1",e:"Par défaut 1 fois (non-lettres)."},{l:"c - 'a' + 1",e:"Position dans l'alphabet."},{l:"while (j < repeat)",e:"Boucle interne : répète le char."}],pitfalls:["Oublier les majuscules","c - 'a' sans + 1 \u2192 'a' = 0 fois","Ne pas init repeat = 1"],tests:[{i:'"abc"',o:"abbccc"},{i:'"a!b"',o:"a!bb"},{i:'"Z"',o:"26\u00d7Z"}],quiz:[{q:"Combien de fois 'c' ?",opts:["1","2","3"],correct:2,ex:"'c'-'a'+1 = 3."},{q:"Un espace ?",opts:["Pas affiché","1 fois","32 fois"],correct:1,ex:"Pas une lettre \u2192 repeat = 1."},{q:"'z' - 'a' + 1 = ?",opts:["25","26","27"],correct:1,ex:"122 - 97 + 1 = 26."}],starter:"#include <unistd.h>\n\nint\tmain(int argc, char **argv)\n{\n\t// Double boucle : parcours + repeat\n\n\treturn (0);\n}",checks:[{p:"- 'a'",m:"c - 'a'"},{p:"- 'A'",m:"c - 'A'"},{p:"+ 1",m:"+ 1"}]},
{id:"rotone",title:"rotone",cat:"cipher",level:1,xp:120,theory:[{title:"Le modulo % \u2014 Boucler proprement",text:"L'opérateur % donne le RESTE de la division :\n10 % 3 = 1\n26 % 26 = 0\n27 % 26 = 1\n\nC'est parfait pour \"boucler\" : quand on dépasse z, on revient à a.\n\nSi on fait juste 'z' + 1, on obtient '{' (pas 'a' !). Le modulo résout ça.",code:"// Sans modulo :\n'z' + 1 = '{'   // FAUX\n\n// Avec modulo :\n('z' - 'a' + 1) % 26 + 'a'\n= (25 + 1) % 26 + 'a'\n= 0 + 'a' = 'a'  // CORRECT !"},{title:"La formule de rotation",text:"Formule universelle :\n\n(c - base + décalage) % 26 + base\n\n\u2022 base = 'a' pour minuscules, 'A' pour majuscules\n\u2022 décalage = 1 pour rotone, 13 pour rot_13\n\nÉtapes :\n1. c - base \u2192 position (0 à 25)\n2. + décalage \u2192 nouvelle position\n3. % 26 \u2192 wrap si dépassement\n4. + base \u2192 reconvertir en char",code:"if (c >= 'a' && c <= 'z')\n\tc = (c - 'a' + 1) % 26 + 'a';\nelse if (c >= 'A' && c <= 'Z')\n\tc = (c - 'A' + 1) % 26 + 'A';"}],subject:"rotone.c \u2014 Allowed: write\nRemplace chaque lettre par la suivante. z\u2192a, Z\u2192A.\nSi argc != 2 \u2192 juste \\n.",solution:"#include <unistd.h>\n\nint\tmain(int argc, char **argv)\n{\n\tint\t\ti;\n\tchar\tc;\n\n\tif (argc == 2)\n\t{\n\t\ti = 0;\n\t\twhile (argv[1][i])\n\t\t{\n\t\t\tc = argv[1][i];\n\t\t\tif (c >= 'a' && c <= 'z')\n\t\t\t\tc = (c - 'a' + 1) % 26 + 'a';\n\t\t\telse if (c >= 'A' && c <= 'Z')\n\t\t\t\tc = (c - 'A' + 1) % 26 + 'A';\n\t\t\twrite(1, &c, 1);\n\t\t\ti++;\n\t\t}\n\t}\n\twrite(1, \"\\n\", 1);\n\treturn (0);\n}",walk:[{l:"(c - 'a' + 1) % 26 + 'a'",e:"Normalise, +1, wrap, reconvertit."},{l:"Deux blocs if/else if",e:"Min et maj séparés. Non-lettres passent."}],pitfalls:["Oublier %26","Oublier les majuscules","Transformer les non-lettres"],tests:[{i:'"abc"',o:"bcd"},{i:'"zZ"',o:"aA"},{i:'"Hello!"',o:"Ifmmp!"}],quiz:[{q:"rotone('z') = ?",opts:["'{'","'a'"],correct:1,ex:"(25+1)%26=0, 0+'a'='a'."},{q:"rotone('5') = ?",opts:["'6'","'5' inchangé"],correct:1,ex:"Pas une lettre."},{q:"La formule marche pour rot_13 ?",opts:["Non","Oui, change 1 en 13"],correct:1,ex:"Même formule, seul le décalage change."}],starter:"#include <unistd.h>\n\nint\tmain(int argc, char **argv)\n{\n\t// (c - 'a' + 1) % 26 + 'a'\n\n\treturn (0);\n}",checks:[{p:"% 26",m:"%26 wrap"},{p:"- 'a'",m:"- 'a'"},{p:"+ 1",m:"+1 décalage"}]},
{id:"rot_13",title:"rot_13",cat:"cipher",level:1,xp:100,theory:[{title:"Identique à rotone \u2014 juste +13",text:"rot_13 = même code que rotone, avec +13 au lieu de +1.\n\n(c - 'a' + 13) % 26 + 'a'\n\nPropriété fun : ROT13 appliqué 2 fois redonne le texte original (13+13 = 26 = 0 mod 26). Chiffrement symétrique.\n\nSi tu sais coder rotone, copie-colle et change 1 en 13.",code:"// rotone : + 1\nc = (c - 'a' + 1) % 26 + 'a';\n\n// rot_13 : + 13\nc = (c - 'a' + 13) % 26 + 'a';\n\n// ROT13(\"Hello\") = \"Uryyb\"\n// ROT13(\"Uryyb\") = \"Hello\"  \u2190 symétrique !"}],subject:"rot_13.c \u2014 Allowed: write\nRemplace chaque lettre par celle 13 positions plus loin.\nSi argc != 2 \u2192 juste \\n.",solution:"#include <unistd.h>\n\nint\tmain(int argc, char **argv)\n{\n\tint\t\ti;\n\tchar\tc;\n\n\tif (argc == 2)\n\t{\n\t\ti = 0;\n\t\twhile (argv[1][i])\n\t\t{\n\t\t\tc = argv[1][i];\n\t\t\tif (c >= 'a' && c <= 'z')\n\t\t\t\tc = (c - 'a' + 13) % 26 + 'a';\n\t\t\telse if (c >= 'A' && c <= 'Z')\n\t\t\t\tc = (c - 'A' + 13) % 26 + 'A';\n\t\t\twrite(1, &c, 1);\n\t\t\ti++;\n\t\t}\n\t}\n\twrite(1, \"\\n\", 1);\n\treturn (0);\n}",walk:[{l:"+ 13",e:"Seule différence avec rotone."}],pitfalls:["Copier rotone et oublier de changer 1\u219213"],tests:[{i:'"abc"',o:"nop"},{i:'"Hello!"',o:"Uryyb!"},{i:'"Uryyb!"',o:"Hello!"}],quiz:[{q:"ROT13('n') = ?",opts:["'a'","'z'","'m'"],correct:0,ex:"(13+13)%26=0, 0+'a'='a'."},{q:"ROT13(ROT13('Hello')) = ?",opts:["'Uryyb'","'Hello'"],correct:1,ex:"Symétrique : 13+13=26=0."}],starter:"#include <unistd.h>\n\nint\tmain(int argc, char **argv)\n{\n\t// Comme rotone mais + 13\n\n\treturn (0);\n}",checks:[{p:"% 26",m:"%26"},{p:"+ 13",m:"+13"},{p:"argc",m:"argc"}]},
{id:"fizzbuzz",title:"fizzbuzz",cat:"logic",level:1,xp:160,theory:[{title:"Le modulo % pour la divisibilité",text:"Si le reste est 0, le nombre est divisible :\n\n15 % 3 = 0 \u2192 divisible par 3\n15 % 5 = 0 \u2192 divisible par 5\n7 % 3 = 1 \u2192 PAS divisible\n\nPour fizzbuzz :\n\u2022 n % 3 == 0 \u2192 \"fizz\"\n\u2022 n % 5 == 0 \u2192 \"buzz\"\n\u2022 n % 15 == 0 \u2192 \"fizzbuzz\"",code:"if (n % 15 == 0)   // Divisible par 3 ET 5\nif (n % 3 == 0)    // Divisible par 3\nif (n % 5 == 0)    // Divisible par 5"},{title:"L'ORDRE des tests est CRUCIAL",text:"15 est divisible par 3 ET par 5. Si tu testes %3 d'abord, 15 affichera \"fizz\" au lieu de \"fizzbuzz\".\n\nRÈGLE : tester %15 EN PREMIER.\n\n1. if (n % 15 == 0) \u2192 fizzbuzz\n2. else if (n % 3 == 0) \u2192 fizz\n3. else if (n % 5 == 0) \u2192 buzz\n4. else \u2192 le nombre",code:"// FAUX \u2014 15 affichera \"fizz\" :\nif (n % 3 == 0) \u2192 fizz\nelse if (n % 5 == 0) \u2192 buzz\n\n// CORRECT \u2014 %15 en premier :\nif (n % 15 == 0) \u2192 fizzbuzz\nelse if (n % 3 == 0) \u2192 fizz\nelse if (n % 5 == 0) \u2192 buzz\nelse \u2192 nombre"},{title:"ft_putnbr \u2014 Afficher un nombre avec write",text:"write() ne peut afficher que des chars. Pour afficher 42 :\n\nchiffre + '0' = char\n\u2022 4 + '0' = '4'\n\u2022 7 + '0' = '7'\n\nPour les nombres \u00e0 plusieurs chiffres, récursion :\nsi n >= 10, traite d'abord n/10, puis n%10.",code:"void\tft_putnbr(int n)\n{\n\tchar c;\n\n\tif (n >= 10)\n\t\tft_putnbr(n / 10);\n\tc = (n % 10) + '0';\n\twrite(1, &c, 1);\n}\n\n// ft_putnbr(42) :\n// 42 >= 10 \u2192 ft_putnbr(4) \u2192 '4'\n// puis '2'\n// R\u00e9sultat : \"42\""}],subject:"fizzbuzz.c \u2014 Allowed: write\nAffiche 1 à 100 séparés par \\n.\nMultiple de 3 \u2192 \"fizz\", de 5 \u2192 \"buzz\", des deux \u2192 \"fizzbuzz\".",solution:"#include <unistd.h>\n\nvoid\tft_putnbr(int n)\n{\n\tchar\tc;\n\n\tif (n >= 10)\n\t\tft_putnbr(n / 10);\n\tc = (n % 10) + '0';\n\twrite(1, &c, 1);\n}\n\nint\tmain(void)\n{\n\tint\ti;\n\n\ti = 1;\n\twhile (i <= 100)\n\t{\n\t\tif (i % 15 == 0)\n\t\t\twrite(1, \"fizzbuzz\", 8);\n\t\telse if (i % 3 == 0)\n\t\t\twrite(1, \"fizz\", 4);\n\t\telse if (i % 5 == 0)\n\t\t\twrite(1, \"buzz\", 4);\n\t\telse\n\t\t\tft_putnbr(i);\n\t\twrite(1, \"\\n\", 1);\n\t\ti++;\n\t}\n\treturn (0);\n}",walk:[{l:"ft_putnbr",e:"Récursif : n/10 d'abord, puis n%10+'0'."},{l:"if (i % 15 == 0)",e:"TEST EN PREMIER."},{l:"write(\"\\n\") après les if",e:"Chaque ligne finit par \\n."}],pitfalls:["Tester %3 avant %15","Oublier ft_putnbr","'FizzBuzz' au lieu de 'fizzbuzz'","Commencer à 0 au lieu de 1"],tests:[{i:"1",o:"1"},{i:"3",o:"fizz"},{i:"5",o:"buzz"},{i:"15",o:"fizzbuzz"},{i:"100",o:"buzz"}],quiz:[{q:"Que doit afficher 30 ?",opts:["fizz","buzz","fizzbuzz"],correct:2,ex:"30%15==0 \u2192 fizzbuzz."},{q:"Pourquoi ft_putnbr est récursif ?",opts:["Pas nécessaire","Pour traiter les chiffres de gauche avant le dernier"],correct:1,ex:"42: ft_putnbr(4)\u2192'4', puis '2'."},{q:"La boucle commence à ?",opts:["0","1"],correct:1,ex:"Le sujet dit 'from 1 to 100'."}],starter:"#include <unistd.h>\n\n// ft_putnbr ici\n\nint\tmain(void)\n{\n\t// 1 à 100 : %15, %3, %5, else\n\n\treturn (0);\n}",checks:[{p:"% 15",m:"%15 EN PREMIER"},{p:"% 3",m:"%3"},{p:"% 5",m:"%5"},{p:"ft_putnbr",m:"ft_putnbr"},{p:"\"fizzbuzz\"",m:"fizzbuzz minuscules"}]},

function PtrDiag(){return <svg viewBox="0 0 400 100" className="diagram" style={{maxWidth:380}}><defs><marker id="a" markerWidth={8} markerHeight={6} refX={8} refY={3} orient="auto"><path d="M0,0 L8,3 L0,6" fill="#fb923c"/></marker></defs><rect x={10} y={25} width={100} height={50} rx={8} fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.3)" strokeWidth={1.5}/><text x={60} y={45} textAnchor="middle" fill="#c084fc" fontSize={10} fontFamily="'JetBrains Mono',monospace">str[0]</text><text x={60} y={63} textAnchor="middle" fill="#e5e7eb" fontSize={15} fontFamily="'JetBrains Mono',monospace" fontWeight={700}>'H'</text><line x1={110} y1={50} x2={190} y2={50} stroke="#fb923c" strokeWidth={2} markerEnd="url(#a)"/><text x={150} y={40} textAnchor="middle" fill="#fb923c" fontSize={12} fontFamily="'JetBrains Mono',monospace" fontWeight={700}>&amp;</text><rect x={190} y={25} width={120} height={50} rx={8} fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.3)" strokeWidth={1.5}/><text x={250} y={45} textAnchor="middle" fill="#67e8f9" fontSize={10} fontFamily="'JetBrains Mono',monospace">&amp;str[0]</text><text x={250} y={63} textAnchor="middle" fill="#e5e7eb" fontSize={14} fontFamily="'JetBrains Mono',monospace" fontWeight={700}>0x7A</text></svg>}

function Qz({questions:qs,onPass}){const[a,sA]=useState({});const[d,sD]=useState(false);const f=Object.keys(a).length===qs.length;const sc=qs.reduce((s,q,i)=>s+(a[i]===q.correct?1:0),0);return <div>{qs.map((q,qi)=><div key={qi} className="quiz-card" style={{borderColor:d?(a[qi]===q.correct?'var(--green-border)':'var(--red-border)'):'var(--border)'}}><p className="quiz-q">{qi+1}. {q.q}</p>{q.opts.map((o,oi)=>{const sel=a[qi]===oi,ok=d&&oi===q.correct,no=d&&sel&&oi!==q.correct;return <button key={oi} className={'quiz-opt'+(sel&&!d?' selected':'')+(ok?' correct':'')+(no?' wrong':'')} onClick={()=>{if(!d){const n={...a};n[qi]=oi;sA(n)}}}>{String.fromCharCode(65+oi)}. {o}</button>})}{d&&<p className="quiz-ex" style={{color:a[qi]===q.correct?'var(--green-l)':'var(--red-l)'}}>{a[qi]===q.correct?'✓ ':'✗ '}{q.ex}</p>}</div>)}{!d?<button className="btn btn-primary" disabled={!f} onClick={()=>{if(f){sD(true);if(sc===qs.length)onPass()}}}>Valider</button>:<div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}><span style={{padding:'8px 16px',borderRadius:8,fontSize:15,fontWeight:700,fontFamily:"'JetBrains Mono',monospace",background:sc===qs.length?'var(--green-bg)':'var(--red-bg)',border:'1px solid '+(sc===qs.length?'var(--green-border)':'var(--red-border)'),color:sc===qs.length?'var(--green-l)':'var(--orange)'}}>{sc}/{qs.length}{sc===qs.length&&' 🎉'}</span>{sc<qs.length&&<button className="btn btn-secondary" onClick={()=>{sA({});sD(false)}}>Réessayer</button>}</div>}</div>}

function Ed({exercise:ex,draft,setDraft,onPass}){const ref=useRef(null);const[res,sRes]=useState(null);const val=draft||ex.starter||'';const lines=val.split('\n');const pairs={'(':')','{':'}','[':']','"':'"',"'":"'"};function hk(e){const t=e.target,s=t.selectionStart,en=t.selectionEnd,bf=val.substring(0,s),af=val.substring(en),ls=bf.lastIndexOf('\n')+1,cl=bf.substring(ls),ind=cl.match(/^[\t ]*/)[0];if(e.key==='Tab'){e.preventDefault();if(e.shiftKey){if(val[ls]==='\t'){setDraft(val.substring(0,ls)+val.substring(ls+1));setTimeout(()=>{t.selectionStart=t.selectionEnd=s-1},0)}}else{setDraft(bf+'\t'+af);setTimeout(()=>{t.selectionStart=t.selectionEnd=s+1},0)}return}if(e.key==='Enter'){e.preventDefault();if(bf[s-1]==='{'&&af[0]==='}'){const nw=bf+'\n'+ind+'\t\n'+ind+af;setDraft(nw);setTimeout(()=>{t.selectionStart=t.selectionEnd=s+1+ind.length+1},0)}else{setDraft(bf+'\n'+ind+af);setTimeout(()=>{t.selectionStart=t.selectionEnd=s+1+ind.length},0)}return}if(pairs[e.key]&&s===en){e.preventDefault();setDraft(bf+e.key+pairs[e.key]+af);setTimeout(()=>{t.selectionStart=t.selectionEnd=s+1},0)}}function chk(){const r=(ex.checks||[]).map(c=>({...c,pass:val.includes(c.p)}));const ok=r.every(x=>x.pass);sRes({checks:r,pass:ok});if(ok)onPass()}return <div><div className="editor-wrap"><div className="editor-lines">{lines.map((_,i)=><span key={i} className="editor-line-num">{i+1}</span>)}</div><textarea ref={ref} className="editor-textarea" value={val} onChange={e=>setDraft(e.target.value)} onKeyDown={hk} spellCheck={false}/></div><div style={{marginTop:16,display:'flex',gap:12,flexWrap:'wrap'}}><button className="btn btn-primary" onClick={chk}>Vérifier le code</button><button className="btn btn-secondary" onClick={()=>{setDraft(ex.starter);sRes(null)}}>Reset</button></div>{res&&<div style={{marginTop:16,padding:16,background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--radius)'}}><p style={{fontWeight:700,fontSize:14,marginBottom:10,color:res.pass?'var(--green-l)':'var(--orange)'}}>{res.pass?'✓ Tous les patterns détectés !':'Patterns manquants :'}</p>{res.checks.map((c,i)=><div key={i} className={'check-result '+(c.pass?'check-pass':'check-fail')}>{c.pass?'✓':'✗'} {c.m}</div>)}</div>}</div>}

/* MAIN APP */
function App(){
  const[prog,sProg]=useState(()=>ld());
  const[ci,sCi]=useState(0);
  const[tab,sTab]=useState('theory');
  const[drafts,sDrafts]=useState({});
  const[sbOpen,sSb]=useState(false);
  const qd=useMemo(()=>new Set(prog.quiz||[]),[prog]);
  const cd=useMemo(()=>new Set(prog.code||[]),[prog]);
  const totalXP=useMemo(()=>{let x=0;EX.forEach((e,i)=>{if(qd.has(i))x+=Math.floor(e.xp/2);if(cd.has(i))x+=Math.floor(e.xp/2)});return x},[qd,cd]);
  const done=useMemo(()=>EX.filter((_,i)=>qd.has(i)&&cd.has(i)).length,[qd,cd]);
  const pct=Math.round(done/EX.length*100);
  const maxXP=EX.reduce((s,e)=>s+e.xp,0);
  function unlocked(i){return i<=2||qd.has(i-1)||cd.has(i-1)}
  function status(i){if(qd.has(i)&&cd.has(i))return'complete';if(qd.has(i)||cd.has(i))return'quiz-done';if(unlocked(i))return'available';return'locked'}
  const icons={locked:'🔒',available:'→','quiz-done':'◐',complete:'✓'};
  function up(k,idx){sProg(p=>{const n={...p,[k]:[...new Set([...(p[k]||[]),idx])]};sv(n);return n})}
  function nav(i){if(!unlocked(i))return;sCi(i);sTab('theory');sSb(false);window.scrollTo({top:0,behavior:'smooth'})}
  useEffect(()=>{const b=document.getElementById('progress-bar');if(b)b.style.width=pct+'%'},[pct]);
  const ex=EX[ci],st=status(ci);

  return <div>
    <button className="hamburger" onClick={()=>sSb(!sbOpen)}>☰</button>
    <div className={'overlay'+(sbOpen?' open':'')} onClick={()=>sSb(false)}/>
    <div className={'sidebar'+(sbOpen?' open':'')}>
      <div className="sidebar-header">
        <div className="sidebar-title">42 C GUIDE</div>
        <div className="sidebar-sub">Exam Rank 02 · Level 1</div>
        <div className="sidebar-progress">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
            <span style={{fontSize:11,color:'var(--dim)',fontWeight:500}}>{done}/{EX.length} exercices</span>
            <span className="progress-pct">{pct}%</span>
          </div>
          <div className="progress-bar-bg"><div className="progress-bar-fill" style={{width:pct+'%'}}/></div>
          <div className="progress-label">
            <span className="xp-badge">⚡ {totalXP} / {maxXP} XP</span>
            {done===EX.length&&<span style={{color:'var(--green-l)',fontWeight:700,fontSize:12}}>COMPLET</span>}
          </div>
        </div>
      </div>
      <div className="sidebar-nav">
        {EX.map((e,i)=>{const s=status(i);return <div key={i} className={'nav-item'+(i===ci?' active':'')+(s==='locked'?' locked':'')+(s==='complete'?' completed':'')} onClick={()=>nav(i)}>
          <span className={'nav-icon '+s}>{icons[s]}</span>
          <span>{e.title}</span>
          {(qd.has(i)||cd.has(i))&&<span style={{marginLeft:'auto',fontSize:10,color:s==='complete'?'var(--green)':'var(--purple)',fontWeight:700}}>{s==='complete'?'+'+e.xp:qd.has(i)?'Q':'C'}</span>}
        </div>})}
      </div>
    </div>

    <div className="main"><div className="main-inner fade-in" key={ci}>
      <div className="ex-header">
        <div className="ex-cat">{CATS[ex.cat]||ex.cat}</div>
        <div className="ex-title">{ex.title}</div>
        <div className="ex-num">Exercice {ci+1} / {EX.length}  ·  {ex.xp} XP  · <span style={{color:st==='complete'?'var(--green-l)':st==='quiz-done'?'var(--purple)':'var(--dim)'}}> {st==='complete'?'Complété ✓':st==='quiz-done'?'En cours':'À faire'}</span></div>
      </div>

      <div className="tabs">
        {[{id:'theory',l:'Théorie',ic:'📖'},{id:'subject',l:'Sujet',ic:'📋'},{id:'practice',l:'Pratique',ic:'⌨️'},{id:'quiz',l:'Quiz',ic:'❓'},{id:'solution',l:'Solution',ic:'💡'}].map(t=><button key={t.id} className={'tab'+(tab===t.id?' active':'')} onClick={()=>sTab(t.id)}><span>{t.ic}</span> {t.l}{((t.id==='quiz'&&qd.has(ci))||(t.id==='practice'&&cd.has(ci)))&&<span style={{color:'var(--green)',fontSize:10}}> ✓</span>}</button>)}
      </div>

      {tab==='theory'&&<div className="slide-up">
        {ex.theory.map((t,i)=><div key={i} className="theory-section">
          <div className="theory-step"><span className="theory-step-num">{i+1}</span><h3 className="theory-step-title">{t.title}</h3></div>
          <div className="theory-text">{t.text}</div>
          {t.svg==='memory'&&<MemDiag/>}
          {t.svg==='pointer'&&<PtrDiag/>}
          {t.code&&<CB code={t.code}/>}
        </div>)}
        <div className="box-tip"><p>💡 Maintenant regarde le <strong>Sujet</strong> puis tente la <strong>Pratique</strong> avant de voir la Solution !</p></div>
      </div>}

      {tab==='subject'&&<div className="slide-up">
        <div className="subject-box"><div className="subject-label">SUJET</div><pre className="subject-text">{ex.subject}</pre></div>
        {ex.tests&&<div><h3 style={{fontSize:16,fontWeight:700,margin:'24px 0 12px',color:'var(--text)'}}>Exemples</h3><div className="test-table">{ex.tests.map((t,i)=><div key={i} className="test-row"><code className="test-input">{t.i}</code><span style={{fontSize:11,color:'var(--dark)'}}>→</span><code className="test-output">{t.o}</code></div>)}</div></div>}
      </div>}

      {tab==='practice'&&<div className="slide-up" key={'p'+ci}>
        <p style={{fontSize:13,color:'var(--muted)',marginBottom:16}}>Écris ta solution. Le vérificateur cherche les patterns clés dans ton code.</p>
        <Ed exercise={ex} draft={drafts[ci]} setDraft={v=>sDrafts(d=>({...d,[ci]:v}))} onPass={()=>up('code',ci)}/>
      </div>}

      {tab==='quiz'&&<div className="slide-up" key={'q'+ci}><Qz questions={ex.quiz} onPass={()=>up('quiz',ci)}/></div>}

      {tab==='solution'&&<div className="slide-up">
        <CB code={ex.solution} title={ex.id+'.c'}/>
        <h3 style={{fontSize:16,fontWeight:700,margin:'24px 0 12px',color:'var(--text)'}}>Ligne par ligne</h3>
        {ex.walk.map((w,i)=><div key={i} className="walk-item"><code className="walk-code">{w.l}</code><p className="walk-explain">{w.e}</p></div>)}
        {ex.pitfalls&&<div><h3 style={{fontSize:16,fontWeight:700,margin:'24px 0 12px',color:'var(--red-l)'}}>⚠ Pièges</h3>{ex.pitfalls.map((p,i)=><div key={i} style={{display:'flex',gap:8,marginBottom:6}}><span style={{color:'var(--red)',fontSize:12,flexShrink:0}}>✗</span><p style={{fontSize:13,color:'#d1d5db',margin:0,lineHeight:1.5}}>{p}</p></div>)}</div>}
      </div>}

      <div className="nav-bottom">
        <button className="btn btn-secondary" disabled={ci===0} onClick={()=>nav(ci-1)}>{ci>0?'← '+EX[ci-1].title:''}</button>
        <button className="btn btn-primary" disabled={ci===EX.length-1||!unlocked(ci+1)} onClick={()=>nav(ci+1)}>{ci<EX.length-1?EX[ci+1].title+' →':'Terminé 🎉'}</button>
      </div>
    </div></div>
  </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
