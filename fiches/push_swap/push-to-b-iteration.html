<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>push_to_b — itération pb vs ra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&family=Patrick+Hand&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f0e1a; color: #f0e9d8; font-family: 'Patrick Hand', cursive; min-height: 100vh; overflow: hidden; }

.video { width: 100vw; height: 100vh; display: flex; flex-direction: column; padding: 22px 36px 70px 36px; }

.scene-title {
  font-family: 'Kalam', cursive; font-size: 30px; color: #ffe96b;
  text-align: center; margin-bottom: 4px; min-height: 38px;
  opacity: 0; transform: translateY(-15px); transition: all 0.6s ease;
}
.scene-title.in { opacity: 1; transform: translateY(0); }

.subtitle {
  font-family: 'Caveat', cursive; font-size: 19px; color: #c0b3e0;
  text-align: center; margin-bottom: 14px; min-height: 22px;
}

.main {
  flex: 1; display: flex; gap: 24px; min-height: 0;
}

.stage-wrap {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  position: relative; min-height: 0; gap: 18px; padding-top: 10px;
}

.code-panel {
  width: 420px;
  background: #1a1825;
  border: 2px solid #2a2833;
  border-radius: 12px;
  padding: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  color: #c0b3e0;
  display: flex;
  flex-direction: column;
}
.code-panel .code-title {
  font-family: 'Kalam', cursive; font-size: 13px; color: #79b8d8;
  letter-spacing: 2px; margin-bottom: 10px; padding-bottom: 6px;
  border-bottom: 1px dashed #2a2833;
}
.code-panel pre { font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.7; color: #8f89a6; }
.code-panel .line { display: block; padding: 1px 8px; border-radius: 3px; transition: all 0.4s ease; }
.code-panel .line.hl { background: rgba(255,233,107,0.18); color: #ffe96b; font-weight: 700; box-shadow: inset 4px 0 0 #ffe96b; }
.code-panel .line.hl-pb { background: rgba(111,176,126,0.2); color: #95d8a8; font-weight: 700; box-shadow: inset 4px 0 0 #6fb07e; }
.code-panel .line.hl-ra { background: rgba(217,72,72,0.15); color: #ff8888; font-weight: 700; box-shadow: inset 4px 0 0 #d94848; }
.code-panel .kw { color: #ff9f7a; }
.code-panel .fn { color: #79b8d8; }
.code-panel .com { color: #5c5a75; font-style: italic; }
.code-panel .num { color: #c9a6ff; }

.state-card {
  background: rgba(255, 233, 107, 0.08);
  border: 2px solid #ffe96b;
  border-radius: 8px;
  padding: 10px 14px;
  margin-top: 12px;
  font-family: 'Patrick Hand', cursive;
  font-size: 14px;
  color: #ffe96b;
  line-height: 1.4;
}

.caption {
  font-family: 'Patrick Hand', cursive; font-size: 20px; color: #f0e9d8;
  text-align: center; max-width: 1100px; line-height: 1.5;
  margin: 12px auto 0 auto; min-height: 56px;
  opacity: 0; transform: translateY(15px); transition: all 0.6s ease;
}
.caption.in { opacity: 1; transform: translateY(0); }
.caption b { color: #ff9f7a; }
.caption code { font-family: 'JetBrains Mono', monospace; background: #2a2833; color: #ffb380; padding: 2px 8px; border-radius: 4px; font-size: 16px; }
.caption .hl { background: #ffe96b; color: #0f0e1a; padding: 2px 6px; border-radius: 3px; font-weight: 700; }
.caption .pb-tag { background: #6fb07e; color: #0f0e1a; padding: 1px 7px; border-radius: 3px; font-weight: 700; }
.caption .ra-tag { background: #d94848; color: #f0e9d8; padding: 1px 7px; border-radius: 3px; font-weight: 700; }

/* Stacks display */
.stacks-area {
  display: flex; gap: 60px; align-items: flex-start; justify-content: center;
}
.stack-col {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  min-width: 80px;
}
.stack-label {
  font-family: 'Kalam', cursive; font-size: 22px; color: #ff9f7a;
  font-weight: 700; letter-spacing: 3px; margin-bottom: 4px;
}
.top-arrow { font-family: 'Caveat', cursive; font-size: 15px; color: #ffe96b; height: 18px; }
.box {
  width: 65px; height: 38px;
  background: #2a2833; border: 2.5px solid #ff9f7a;
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 19px;
  color: #f0e9d8;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.5s ease;
  box-shadow: 3px 3px 0 #c0b3e0;
}
.box.top-pb { background: #6fb07e; color: #0f0e1a; border-color: #6fb07e; }
.box.top-ra { background: #d94848; color: #f0e9d8; border-color: #d94848; }
.box.new-bottom { background: #1a1825; opacity: 0.7; }
.box.on-b { background: #c9a6ff; color: #0f0e1a; border-color: #c9a6ff; box-shadow: 3px 3px 0 #2a2833; }
.empty {
  width: 65px; height: 38px;
  border: 2px dashed #5c5a75; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: #5c5a75; font-family: 'Caveat', cursive; font-size: 14px;
}
.bottom-marker { font-family: 'Caveat', cursive; font-size: 12px; color: #5c5a75; font-style: italic; margin-top: 2px; }

.state-bar {
  display: flex; gap: 16px; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace; font-size: 14px;
  background: #1a1825; padding: 10px 18px; border-radius: 8px;
  border: 1px solid #2a2833;
}
.state-bar .pill { background: #2a2833; padding: 4px 12px; border-radius: 6px; }
.state-bar .pill .k { color: #ffe96b; }
.state-bar .pill .v { color: #ff9f7a; font-weight: 700; }
.state-bar .target { color: #6fb07e; font-weight: 700; }

.compare-row {
  display: flex; gap: 18px; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace; font-size: 17px;
}
.compare-row .compare-box {
  background: #1a1825; border: 2px solid #2a2833; border-radius: 8px;
  padding: 10px 16px; min-width: 140px; text-align: center;
}
.compare-row .compare-box .label { color: #5c5a75; font-size: 12px; font-family: 'Kalam', cursive; letter-spacing: 1px; }
.compare-row .compare-box .v { color: #ffe96b; font-size: 22px; font-weight: 700; }
.compare-row .verdict {
  font-family: 'Kalam', cursive; font-size: 20px; padding: 8px 18px;
  border-radius: 8px;
}
.verdict.pb { background: #6fb07e; color: #0f0e1a; }
.verdict.ra { background: #d94848; color: #f0e9d8; }

.big-text {
  font-family: 'Kalam', cursive; font-size: 22px; color: #ffe96b;
  text-align: center; line-height: 1.5;
}

.progress { position: fixed; bottom: 0; left: 0; height: 4px; background: #ffe96b; transition: width 0.2s linear; }
.controls { position: fixed; bottom: 14px; right: 14px; display: flex; gap: 8px; }
.controls button { font-family: 'Kalam', cursive; font-weight: 700; font-size: 14px; background: #2a2833; color: #f0e9d8; border: 2px solid #f0e9d8; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.controls button:hover { background: #ffe96b; color: #0f0e1a; }
.scene-counter { position: fixed; bottom: 18px; left: 20px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #5c5a75; }
.keyhint { position: fixed; bottom: 42px; left: 20px; font-family: 'Caveat', cursive; font-size: 13px; color: #3a3849; }
</style>
</head>
<body>

<div class="video">
  <div class="scene-title" id="title">push_to_b — itération</div>
  <div class="subtitle" id="subtitle"></div>
  <div class="main">
    <div class="stage-wrap" id="stage"></div>
    <div class="code-panel">
      <div class="code-title">push_to_b — boucle while</div>
      <pre id="code-body"></pre>
      <div class="state-card" id="state-card">→ démarrage…</div>
    </div>
  </div>
  <div class="caption" id="caption">démarrage…</div>
</div>

<div class="progress" id="progress"></div>
<div class="scene-counter" id="counter">scène 1 / ?</div>
<div class="keyhint">← prev · space pause · → next</div>
<div class="controls">
  <button id="btn-prev">⏮ prev</button>
  <button id="btn-pause">⏸ pause</button>
  <button id="btn-next">⏭ next</button>
  <button id="btn-replay">↺ replay</button>
</div>

<script>
const CODE_LINES = [
  '<span class="kw">while</span> (pushed != target)',
  '{',
  '  chunk_max = (pushed/chunk_size+1)',
  '              *chunk_size - 1;',
  '  <span class="kw">if</span> ((*a)-&gt;val &lt;= chunk_max)',
  '  {',
  '    <span class="fn">pb</span>(a, b);',
  '    pushed++;',
  '  }',
  '  <span class="kw">else</span>',
  '    <span class="fn">ra</span>(a);',
  '}'
];

function renderCode(hl=[], pb=false, ra=false) {
  return CODE_LINES.map((ln, i) => {
    const lineNum = i + 1;
    let cls = '';
    if (hl.includes(lineNum)) cls = ' hl';
    if (pb && (lineNum === 7 || lineNum === 8)) cls = ' hl-pb';
    if (ra && lineNum === 11) cls = ' hl-ra';
    return `<span class="line${cls}">${ln || ' '}</span>`;
  }).join('\n');
}

function renderStack(name, arr, label, opts = {}) {
  let html = `<div class="stack-col">`;
  html += `<div class="stack-label">${label}</div>`;
  html += `<div class="top-arrow">↓ top</div>`;
  if (arr.length === 0) {
    html += `<div class="empty">vide</div>`;
  } else {
    arr.forEach((v, i) => {
      let cls = 'box';
      if (i === 0 && opts.topClass) cls += ' ' + opts.topClass;
      if (i === arr.length - 1 && opts.lastClass) cls += ' ' + opts.lastClass;
      if (opts.bClass && name === 'b') cls = 'box on-b';
      html += `<div class="${cls}">${v}</div>`;
    });
  }
  html += `<div class="bottom-marker">bottom</div>`;
  html += '</div>';
  return html;
}

function renderState(pushed, target, chunkMax, chunkSize) {
  return `
    <div class="state-bar">
      <div class="pill"><span class="k">chunk_size</span> = <span class="v">${chunkSize}</span></div>
      <div class="pill"><span class="k">pushed</span> = <span class="v">${pushed}</span></div>
      <div class="pill"><span class="k">target</span> = <span class="target">${target}</span></div>
      <div class="pill"><span class="k">chunk_max</span> = <span class="v">${chunkMax}</span></div>
    </div>`;
}

function compareBox(topVal, chunkMax, verdict) {
  return `
    <div class="compare-row">
      <div class="compare-box">
        <div class="label">(*a)->val</div>
        <div class="v">${topVal}</div>
      </div>
      <div style="font-size:24px; color:#5c5a75;">${verdict === 'pb' ? '≤' : '>'}</div>
      <div class="compare-box">
        <div class="label">chunk_max</div>
        <div class="v">${chunkMax}</div>
      </div>
      <div class="verdict ${verdict}">${verdict === 'pb' ? '→ pb' : '→ ra'}</div>
    </div>`;
}

// Setup: A = [5, 1, 7, 2, 0, 6, 3, 4], chunk_size = 3, target = 5
const SCENES = [
  // 1. Intro
  {
    dur: 6500,
    title: "push_to_b — comprendre l'itération",
    subtitle: "pb vs ra : qui fait avancer quoi ?",
    render: (stage, code, state, caption) => {
      stage.innerHTML = `
        <div class="big-text" style="line-height: 1.6;">
          Dans la boucle, à chaque tour on fait <b>une seule</b> action :<br>
          soit <span class="pb-tag" style="background:#6fb07e; color:#0f0e1a; padding:2px 8px; border-radius:4px;">pb</span> (push vers B),
          soit <span class="ra-tag" style="background:#d94848; color:#f0e9d8; padding:2px 8px; border-radius:4px;">ra</span> (rotation de A).<br><br>

          Question : <b>quand est-ce que pushed augmente ?</b><br>
          <b>quand est-ce qu'on saute au tour suivant ?</b>
        </div>`;
      code.innerHTML = renderCode([1]);
      state.innerHTML = '→ on déroule sur un exemple :<br>A = [5, 1, 7, 2, 0, 6, 3, 4], chunk_size = 3';
      caption.innerHTML = "Imagine une pile de 8 nums déjà indexés (rangs 0-7), chunk_size = 3. target = 8 - 3 = <b>5</b>. On va dérouler 5-6 itérations pour voir le mécanisme.";
    }
  },

  // 2. État initial
  {
    dur: 7000,
    title: "État initial",
    subtitle: "pushed=0, chunk_max=2 (chunk 0 : rangs 0-2)",
    render: (stage, code, state, caption) => {
      stage.innerHTML = `
        ${renderState(0, 5, 2, 3)}
        <div class="stacks-area">
          ${renderStack('a', ['5','1','7','2','0','6','3','4'], 'A')}
          ${renderStack('b', [], 'B')}
        </div>`;
      code.innerHTML = renderCode([3]);
      state.innerHTML = 'On rentre dans la boucle.<br>top de A = 5.';
      caption.innerHTML = "On démarre. <code>chunk_max</code> vaut <b>2</b> : on accepte les rangs 0, 1, ou 2 dans le chunk 0. Le top de A est <b>5</b>.";
    }
  },

  // 3. Itération 1 — ra
  {
    dur: 9000,
    title: "Itération 1 : top=5 > chunk_max=2",
    subtitle: "→ ra (rotation, pushed reste à 0)",
    render: (stage, code, state, caption) => {
      stage.innerHTML = `
        ${renderState(0, 5, 2, 3)}
        ${compareBox(5, 2, 'ra')}
        <div class="stacks-area">
          ${renderStack('a', ['5','1','7','2','0','6','3','4'], 'A', {topClass: 'top-ra'})}
          ${renderStack('b', [], 'B')}
        </div>`;
      code.innerHTML = renderCode([], false, true);
      state.innerHTML = '5 > 2 → on entre dans le else<br>ra(a) → 5 part au bottom<br><b>pushed reste à 0</b>';
      caption.innerHTML = "Le top <b>5</b> n'est pas dans le chunk 0. On fait <code>ra</code> : le 5 va à la fin de A, le 1 devient le nouveau top. <span class='ra-tag'>pushed reste à 0</span> parce qu'on n'a rien envoyé sur B.";
    }
  },

  // 4. Après ra, état suivant
  {
    dur: 7500,
    title: "État après ra : pushed inchangé",
    subtitle: "A a juste tourné, son contenu est intact",
    render: (stage, code, state, caption) => {
      stage.innerHTML = `
        ${renderState(0, 5, 2, 3)}
        <div class="stacks-area">
          ${renderStack('a', ['1','7','2','0','6','3','4','5'], 'A')}
          ${renderStack('b', [], 'B')}
        </div>`;
      code.innerHTML = renderCode([1]);
      state.innerHTML = 'A = [1, 7, 2, 0, 6, 3, 4, 5]<br>même taille que avant.<br>top = 1.';
      caption.innerHTML = "Tour suivant. A a 8 éléments, B est vide, <code>pushed</code> est toujours 0. Le top est maintenant <b>1</b>.";
    }
  },

  // 5. Itération 2 — pb
  {
    dur: 9000,
    title: "Itération 2 : top=1 ≤ chunk_max=2",
    subtitle: "→ pb (push vers B, pushed++)",
    render: (stage, code, state, caption) => {
      stage.innerHTML = `
        ${renderState(0, 5, 2, 3)}
        ${compareBox(1, 2, 'pb')}
        <div class="stacks-area">
          ${renderStack('a', ['1','7','2','0','6','3','4','5'], 'A', {topClass: 'top-pb'})}
          ${renderStack('b', [], 'B')}
        </div>`;
      code.innerHTML = renderCode([], true, false);
      state.innerHTML = '1 ≤ 2 → on entre dans le if<br>pb(a, b) → 1 part sur B<br><b>pushed passe à 1</b>';
      caption.innerHTML = "Le top <b>1</b> est dans le chunk 0. On fait <code>pb</code> : le 1 part sur B. <span class='pb-tag'>pushed devient 1</span>.";
    }
  },

  // 6. Après pb
  {
    dur: 7500,
    title: "État après pb : pushed = 1, B = [1]",
    subtitle: "A a perdu son top, B en a gagné un",
    render: (stage, code, state, caption) => {
      stage.innerHTML = `
        ${renderState(1, 5, 2, 3)}
        <div class="stacks-area">
          ${renderStack('a', ['7','2','0','6','3','4','5'], 'A')}
          ${renderStack('b', ['1'], 'B')}
        </div>`;
      code.innerHTML = renderCode([1]);
      state.innerHTML = 'A perdu un élément (taille 7).<br>B a maintenant le 1.<br>pushed = 1.';
      caption.innerHTML = "Tour suivant. A a perdu un élément, B en a gagné. On continue avec le nouveau top de A : <b>7</b>.";
    }
  },

  // 7. Saut rapide : plusieurs itérations
  {
    dur: 9000,
    title: "On saute quelques itérations...",
    subtitle: "pour aller plus vite à un moment intéressant",
    render: (stage, code, state, caption) => {
      stage.innerHTML = `
        <div class="big-text" style="text-align: left; font-size: 18px; line-height: 1.7;">
          ・top=7 > 2 → <span class="ra-tag">ra</span> &nbsp;&nbsp;(pushed=1)<br>
          ・top=2 ≤ 2 → <span class="pb-tag">pb</span> &nbsp;&nbsp;(pushed=2)<br>
          ・top=0 ≤ 2 → <span class="pb-tag">pb</span> &nbsp;&nbsp;(pushed=3)<br>
          <br>
          ★ pushed = 3 → on a fini le chunk 0 !<br>
          chunk_max recalculé = (3/3+1)*3-1 = <b style="color:#79b8d8;">5</b><br>
          → on accepte maintenant les rangs 3-5 (chunk 1)
        </div>
        ${renderState(3, 5, 5, 3)}
        <div class="stacks-area">
          ${renderStack('a', ['6','3','4','5','7'], 'A')}
          ${renderStack('b', ['0','2','1'], 'B', {bClass: true})}
        </div>`;
      code.innerHTML = renderCode([3]);
      state.innerHTML = 'Chunk 0 complet (3 éléments)<br>chunk_max saute à 5 automatiquement';
      caption.innerHTML = "Après 5 itérations, chunk 0 est rempli. La formule de chunk_max bascule à <b>5</b> automatiquement (parce que pushed=3 a franchi le multiple de 3). Maintenant on accepte les rangs <b>3, 4, 5</b>.";
    }
  },

  // 8. Itération avec chunk 1
  {
    dur: 9000,
    title: "Itération avec chunk 1 : top=6 > chunk_max=5",
    subtitle: "→ ra encore (mais cette fois pour le chunk 1)",
    render: (stage, code, state, caption) => {
      stage.innerHTML = `
        ${renderState(3, 5, 5, 3)}
        ${compareBox(6, 5, 'ra')}
        <div class="stacks-area">
          ${renderStack('a', ['6','3','4','5','7'], 'A', {topClass: 'top-ra'})}
          ${renderStack('b', ['0','2','1'], 'B', {bClass: true})}
        </div>`;
      code.innerHTML = renderCode([], false, true);
      state.innerHTML = '6 > 5 → ra(a)<br>pushed reste 3<br>(le 6 attendra le chunk 2)';
      caption.innerHTML = "Même mécanisme qu'avant. Le 6 n'est pas dans chunk 1 (qui va jusqu'à 5). On fait <code>ra</code> pour passer au suivant.";
    }
  },

  // 9. Pb pour chunk 1
  {
    dur: 9000,
    title: "Itération suivante : top=3 ≤ chunk_max=5",
    subtitle: "→ pb pour chunk 1",
    render: (stage, code, state, caption) => {
      stage.innerHTML = `
        ${renderState(3, 5, 5, 3)}
        ${compareBox(3, 5, 'pb')}
        <div class="stacks-area">
          ${renderStack('a', ['3','4','5','7','6'], 'A', {topClass: 'top-pb'})}
          ${renderStack('b', ['0','2','1'], 'B', {bClass: true})}
        </div>`;
      code.innerHTML = renderCode([], true, false);
      state.innerHTML = '3 ≤ 5 → pb<br>pushed passe à 4';
      caption.innerHTML = "Le 3 est dans chunk 1. On le push. <code>pushed = 4</code>.";
    }
  },

  // 10. Dernière itération
  {
    dur: 8000,
    title: "Dernière itération : top=4 ≤ 5",
    subtitle: "pushed = 5 = target → STOP",
    render: (stage, code, state, caption) => {
      stage.innerHTML = `
        ${renderState(5, 5, 5, 3)}
        <div class="stacks-area">
          ${renderStack('a', ['5','7','6'], 'A')}
          ${renderStack('b', ['4','3','0','2','1'], 'B', {bClass: true})}
        </div>
        <div class="big-text" style="font-size: 20px; color: #95d8a8;">
          ✓ pushed = target = 5 → on sort de la boucle
        </div>`;
      code.innerHTML = renderCode([], true, false);
      state.innerHTML = "5 ≤ 5 → pb<br>pushed = 5 = target<br>→ while s'arrête";
      caption.innerHTML = "Après ce dernier pb, <code>pushed</code> atteint <code>target</code>. La condition <code>pushed != target</code> devient fausse. <b>Boucle terminée.</b>";
    }
  },

  // 11. Récap
  {
    dur: 9000,
    title: "Récap : pb vs ra",
    subtitle: "ce qu'il faut retenir",
    render: (stage, code, state, caption) => {
      stage.innerHTML = `
        <div style="display:flex; gap:30px; justify-content:center;">
          <div style="background:rgba(111,176,126,0.1); border:2px solid #6fb07e; border-radius:10px; padding:18px 22px; max-width:380px;">
            <div style="color:#95d8a8; font-family:'Kalam',cursive; font-size:20px; margin-bottom:10px;">✓ pb (cas if)</div>
            <div style="color:#c0b3e0; font-size:16px; line-height:1.6;">
              • Top de A est dans le chunk<br>
              • On déplace 1 élément vers B<br>
              • pushed <b>++ </b>(monte de 1)<br>
              • A perd son top<br>
              • B gagne un nouveau top
            </div>
          </div>
          <div style="background:rgba(217,72,72,0.1); border:2px solid #d94848; border-radius:10px; padding:18px 22px; max-width:380px;">
            <div style="color:#ff8888; font-family:'Kalam',cursive; font-size:20px; margin-bottom:10px;">✗ ra (cas else)</div>
            <div style="color:#c0b3e0; font-size:16px; line-height:1.6;">
              • Top de A n'est pas dans le chunk<br>
              • On le met au bottom de A<br>
              • pushed <b>reste pareil</b><br>
              • B inchangée<br>
              • A garde sa taille
            </div>
          </div>
        </div>
        <div class="big-text" style="font-size: 22px;">
          La boucle while s'exécute <b>à chaque tour</b>,<br>
          mais ce n'est <b>que pb</b> qui fait progresser pushed.
        </div>`;
      caption.innerHTML = "C'est exactement comme un tri par cartes : tu retournes une carte, si elle te plaît tu la mets dans la pile triée (pb, compteur ++), sinon tu la mets en dessous du paquet pour la voir plus tard (ra, compteur identique).";
    }
  }
];

let currentScene = 0;
let timer = null;
let paused = false;
let startTime = 0;
let remainingTime = 0;

const titleEl = document.getElementById('title');
const subtitleEl = document.getElementById('subtitle');
const stageEl = document.getElementById('stage');
const codeBodyEl = document.getElementById('code-body');
const stateCardEl = document.getElementById('state-card');
const captionEl = document.getElementById('caption');
const progressEl = document.getElementById('progress');
const counterEl = document.getElementById('counter');

function playScene(idx) {
  if (idx >= SCENES.length) idx = 0;
  if (idx < 0) idx = SCENES.length - 1;
  currentScene = idx;
  const s = SCENES[idx];

  titleEl.classList.remove('in');
  captionEl.classList.remove('in');

  setTimeout(() => {
    titleEl.textContent = s.title;
    subtitleEl.textContent = s.subtitle || '';
    s.render(stageEl, codeBodyEl, stateCardEl, captionEl);

    setTimeout(() => {
      titleEl.classList.add('in');
      setTimeout(() => captionEl.classList.add('in'), 200);
    }, 80);

    counterEl.textContent = `scène ${idx + 1} / ${SCENES.length}`;
    progressEl.style.width = ((idx + 1) / SCENES.length * 100) + '%';

    startTime = Date.now();
    remainingTime = s.dur;
    if (!paused) scheduleNext(s.dur);
  }, 350);
}

function scheduleNext(delay) { if (timer) clearTimeout(timer); timer = setTimeout(() => playScene(currentScene + 1), delay); }
function togglePause() {
  paused = !paused;
  const btn = document.getElementById('btn-pause');
  btn.textContent = paused ? '▶ reprendre' : '⏸ pause';
  if (paused) { if (timer) clearTimeout(timer); remainingTime -= (Date.now() - startTime); }
  else { startTime = Date.now(); scheduleNext(Math.max(remainingTime, 500)); }
}
function replay() { paused = false; document.getElementById('btn-pause').textContent = '⏸ pause'; if (timer) clearTimeout(timer); playScene(0); }
function prev() { if (timer) clearTimeout(timer); playScene(currentScene - 1); }
function next() { if (timer) clearTimeout(timer); playScene(currentScene + 1); }

document.getElementById('btn-pause').addEventListener('click', togglePause);
document.getElementById('btn-replay').addEventListener('click', replay);
document.getElementById('btn-prev').addEventListener('click', prev);
document.getElementById('btn-next').addEventListener('click', next);

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); prev(); }
  if (e.code === 'ArrowRight') { e.preventDefault(); next(); }
  if (e.code === 'KeyR') { e.preventDefault(); replay(); }
});

playScene(0);
</script>
