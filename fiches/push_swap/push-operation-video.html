<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>push operation — pa / pb visualisé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&family=Patrick+Hand&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0f0e1a;
  color: #f0e9d8;
  font-family: 'Patrick Hand', cursive;
  min-height: 100vh;
  overflow: hidden;
}

.video {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 30px 40px 70px 40px;
}

.scene-title {
  font-family: 'Kalam', cursive;
  font-size: 36px;
  color: #ffe96b;
  text-align: center;
  margin-bottom: 14px;
  min-height: 50px;
  opacity: 0;
  transform: translateY(-20px);
  transition: all 0.6s ease;
}
.scene-title.in { opacity: 1; transform: translateY(0); }

.subtitle {
  font-family: 'Caveat', cursive;
  font-size: 22px;
  color: #c0b3e0;
  text-align: center;
  margin-bottom: 20px;
  min-height: 28px;
}

.main {
  flex: 1;
  display: flex;
  gap: 30px;
  min-height: 0;
}

.stage-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  min-height: 0;
}

.stacks {
  display: flex;
  gap: 100px;
  align-items: flex-start;
  justify-content: center;
  position: relative;
}

.stack-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  position: relative;
}

.stack-label {
  font-family: 'Kalam', cursive;
  font-size: 28px;
  color: #ff9f7a;
  font-weight: 700;
  margin-bottom: 4px;
  letter-spacing: 4px;
}

.top-marker {
  font-family: 'Caveat', cursive;
  font-size: 18px;
  color: #ffe96b;
  margin-bottom: 4px;
  height: 22px;
}

.box {
  width: 110px;
  height: 60px;
  background: #2a2833;
  border: 3px solid #ff9f7a;
  border-radius: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 28px;
  color: #f0e9d8;
  box-shadow: 4px 4px 0 #c0b3e0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}

.box.moving {
  background: #ffe96b;
  color: #0f0e1a;
  border-color: #ffe96b;
  z-index: 10;
}

.box.fade-out {
  opacity: 0;
  transform: scale(0.6) translateY(-30px);
}

.box.flying {
  position: absolute;
  z-index: 100;
  background: #ffe96b;
  color: #0f0e1a;
  border-color: #ffe96b;
  box-shadow: 0 0 20px #ffe96b;
}

.bottom-marker {
  font-family: 'Caveat', cursive;
  font-size: 14px;
  color: #5c5a75;
  font-style: italic;
  margin-top: 4px;
}

.empty-stack {
  width: 110px;
  height: 60px;
  border: 2px dashed #5c5a75;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #5c5a75;
  font-family: 'Caveat', cursive;
  font-size: 18px;
  font-style: italic;
}

.code-panel {
  width: 460px;
  background: #1a1825;
  border: 2px solid #2a2833;
  border-radius: 12px;
  padding: 22px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: #c0b3e0;
  display: flex;
  flex-direction: column;
}

.code-panel .code-title {
  font-family: 'Kalam', cursive;
  font-size: 14px;
  color: #79b8d8;
  letter-spacing: 2px;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px dashed #2a2833;
}

.code-panel pre {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  line-height: 2;
  white-space: pre;
  color: #8f89a6;
}

.code-panel .line {
  display: block;
  padding: 2px 10px;
  border-radius: 4px;
  transition: all 0.4s ease;
}
.code-panel .line.hl {
  background: rgba(255, 233, 107, 0.15);
  color: #ffe96b;
  font-weight: 700;
  box-shadow: inset 4px 0 0 #ffe96b;
}
.code-panel .line.done {
  color: #6fb07e;
}

.code-panel .kw { color: #ff9f7a; }
.code-panel .fn { color: #79b8d8; }
.code-panel .com { color: #5c5a75; font-style: italic; }

.action-card {
  background: rgba(255, 233, 107, 0.08);
  border: 2px solid #ffe96b;
  border-radius: 8px;
  padding: 14px 18px;
  margin-top: 16px;
  font-family: 'Patrick Hand', cursive;
  font-size: 16px;
  color: #ffe96b;
  line-height: 1.4;
}

.caption {
  font-family: 'Patrick Hand', cursive;
  font-size: 22px;
  color: #f0e9d8;
  text-align: center;
  max-width: 1100px;
  line-height: 1.5;
  margin: 18px auto 0 auto;
  min-height: 60px;
  opacity: 0;
  transform: translateY(15px);
  transition: all 0.6s ease;
}
.caption.in { opacity: 1; transform: translateY(0); }
.caption b { color: #ff9f7a; }
.caption code { font-family: 'JetBrains Mono', monospace; background: #2a2833; color: #ffb380; padding: 2px 8px; border-radius: 4px; font-size: 18px; }
.caption .hl { background: #ffe96b; color: #0f0e1a; padding: 2px 6px; border-radius: 3px; font-weight: 700; }

.progress {
  position: fixed;
  bottom: 0;
  left: 0;
  height: 4px;
  background: #ffe96b;
  transition: width 0.2s linear;
  z-index: 100;
}

.controls {
  position: fixed;
  bottom: 14px;
  right: 14px;
  display: flex;
  gap: 8px;
  z-index: 100;
}
.controls button {
  font-family: 'Kalam', cursive;
  font-weight: 700;
  font-size: 14px;
  background: #2a2833;
  color: #f0e9d8;
  border: 2px solid #f0e9d8;
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
}
.controls button:hover { background: #ffe96b; color: #0f0e1a; }

.scene-counter {
  position: fixed;
  bottom: 18px;
  left: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: #5c5a75;
}

.keyhint {
  position: fixed;
  bottom: 42px;
  left: 20px;
  font-family: 'Caveat', cursive;
  font-size: 13px;
  color: #3a3849;
}

.arrow-marker {
  position: absolute;
  font-size: 32px;
  color: #ffe96b;
  font-family: 'JetBrains Mono', monospace;
  pointer-events: none;
}
</style>
</head>
<body>

<div class="video">
  <div class="scene-title" id="title">push operation</div>
  <div class="subtitle" id="subtitle"></div>
  <div class="main">
    <div class="stage-wrap">
      <div class="stacks" id="stacks"></div>
    </div>
    <div class="code-panel">
      <div class="code-title" id="code-title">push_top — helper</div>
      <pre id="code-body"></pre>
      <div class="action-card" id="action-card">→ scène en cours</div>
    </div>
  </div>
  <div class="caption" id="caption">démarrage…</div>
</div>

<div class="progress" id="progress"></div>
<div class="scene-counter" id="counter">scène 1 / ?</div>
<div class="keyhint">← prev · space pause · → next</div>
<div class="controls">
  <button id="btn-prev">⏮ prev</button>
  <button id="btn-pause">⏸ pause</button>
  <button id="btn-next">⏭ next</button>
  <button id="btn-replay">↺ replay</button>
</div>

<script>
const CODE_LINES = [
  '<span class="kw">static void</span> <span class="fn">push_top</span>(<span class="kw">t_stack</span> **dst, <span class="kw">t_stack</span> **src)',
  '{',
  '  <span class="kw">t_stack</span> *top;',
  '',
  '  <span class="kw">if</span> (!*src)',
  '    <span class="kw">return</span> ;',
  '  top = *src;            <span class="com">// ÉTAPE 1</span>',
  '  *src = top-&gt;next;      <span class="com">// ÉTAPE 2</span>',
  '  top-&gt;next = *dst;      <span class="com">// ÉTAPE 3</span>',
  '  *dst = top;            <span class="com">// ÉTAPE 4</span>',
  '}'
];

function renderCode(highlighted = [], done = []) {
  return CODE_LINES.map((ln, i) => {
    const lineNum = i + 1;
    const cls = highlighted.includes(lineNum) ? ' hl' : (done.includes(lineNum) ? ' done' : '');
    return `<span class="line${cls}">${ln || ' '}</span>`;
  }).join('\n');
}

// Stack rendering helper
function renderStack(name, items, label = name.toUpperCase(), highlight = -1, fadeIdx = -1) {
  const id = `stack-${name}`;
  let html = `<div class="stack-col">`;
  html += `<div class="stack-label">${label}</div>`;
  html += `<div class="top-marker">↓ top</div>`;
  if (items.length === 0) {
    html += `<div class="empty-stack">vide</div>`;
  } else {
    items.forEach((v, i) => {
      let cls = 'box';
      if (i === highlight) cls += ' moving';
      if (i === fadeIdx) cls += ' fade-out';
      html += `<div class="${cls}" data-stack="${name}" data-idx="${i}">${v}</div>`;
    });
  }
  html += `<div class="bottom-marker">bottom</div>`;
  html += `</div>`;
  return html;
}

// SCENES
const SCENES = [
  // 1. Intro
  {
    dur: 6500,
    title: "L'opération push (pa / pb)",
    subtitle: "déplacer le top d'une pile vers le top de l'autre",
    render: (stacks, code, action, caption) => {
      stacks.innerHTML = renderStack('a', [3, 1, 4, 2]) + renderStack('b', [9, 7, 5]);
      code.innerHTML = renderCode();
      action.textContent = '→ on va décortiquer pb (push de A vers B)';
      caption.innerHTML = "On commence avec deux piles A et B. <b>pb</b> = on prend le top de A et on le met au top de B. <b>pa</b> = l'inverse. Dans cette vidéo on déroule pb.";
    }
  },

  // 2. État initial
  {
    dur: 6500,
    title: "État initial",
    subtitle: "A = [3, 1, 4, 2]   ·   B = [9, 7, 5]",
    render: (stacks, code, action, caption) => {
      stacks.innerHTML = renderStack('a', [3, 1, 4, 2]) + renderStack('b', [9, 7, 5]);
      code.innerHTML = renderCode();
      action.textContent = '→ rien n\'a encore bougé';
      caption.innerHTML = "Le top de A est <b>3</b>, le top de B est <b>9</b>. On va déplacer le <b>3</b> vers B.";
    }
  },

  // 3. Étape 1 : top = *src
  {
    dur: 8000,
    title: "Étape 1 — attraper le top",
    subtitle: "top = *src",
    render: (stacks, code, action, caption) => {
      stacks.innerHTML = renderStack('a', [3, 1, 4, 2], 'A', 0) + renderStack('b', [9, 7, 5]);
      code.innerHTML = renderCode([7]);
      action.innerHTML = '<b>top</b> = pointeur sur le 3';
      caption.innerHTML = "On crée un pointeur <code>top</code> qui sauvegarde l'adresse du <span class='hl'>3</span> (le top de A). On a maintenant une référence sur ce node, peu importe ce qui arrive ensuite.";
    }
  },

  // 4. Étape 2 : *src = top->next
  {
    dur: 9000,
    title: "Étape 2 — A oublie son top",
    subtitle: "*src = top->next",
    render: (stacks, code, action, caption) => {
      stacks.innerHTML = renderStack('a', [1, 4, 2]) + renderStack('b', [9, 7, 5]);
      code.innerHTML = renderCode([8], [7]);
      action.innerHTML = '<b>top</b> reste le 3 (en attente)<br>A.head = 1 maintenant';
      caption.innerHTML = "Le head de A devient le <span class='hl'>1</span> (l'ancien 2e). Le <b>3 disparaît visuellement</b> de A — mais il existe toujours en mémoire, on a son adresse dans <code>top</code>.";
    }
  },

  // 5. Étape 3 : top->next = *dst
  {
    dur: 9500,
    title: "Étape 3 — relier top à l'ancien top de B",
    subtitle: "top->next = *dst",
    render: (stacks, code, action, caption) => {
      stacks.innerHTML = `
        <div style="display:flex; gap:100px;">
          ${renderStack('a', [1, 4, 2])}
          <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
            <div class="stack-label" style="visibility:hidden;">·</div>
            <div class="top-marker"></div>
            <div class="box moving" style="margin-bottom:30px;">3</div>
            <div style="font-family:'Caveat',cursive; font-size:18px; color:#ffe96b;">↓ top->next pointe vers</div>
          </div>
          ${renderStack('b', [9, 7, 5])}
        </div>`;
      code.innerHTML = renderCode([9], [7, 8]);
      action.innerHTML = 'le node <b>3</b> chaîne son next vers le <b>9</b>';
      caption.innerHTML = "Le node <span class='hl'>3</span> attache son <code>next</code> sur l'ancien head de B (le <b>9</b>). À ce stade, B ne sait pas encore qu'il a un nouveau top — c'est l'étape 4 qui le fera.";
    }
  },

  // 6. Étape 4 : *dst = top
  {
    dur: 9000,
    title: "Étape 4 — B reconnaît son nouveau top",
    subtitle: "*dst = top",
    render: (stacks, code, action, caption) => {
      stacks.innerHTML = renderStack('a', [1, 4, 2]) + renderStack('b', [3, 9, 7, 5], 'B', 0);
      code.innerHTML = renderCode([10], [7, 8, 9]);
      action.innerHTML = 'B.head = top (le 3)';
      caption.innerHTML = "On dit à B : <span class='hl'>ton head, c'est top maintenant</span>. Le <b>3</b> apparaît officiellement comme top de B. La chaîne 3 → 9 → 7 → 5 est complète.";
    }
  },

  // 7. État final
  {
    dur: 7000,
    title: "État final après pb",
    subtitle: "A = [1, 4, 2]   ·   B = [3, 9, 7, 5]",
    render: (stacks, code, action, caption) => {
      stacks.innerHTML = renderStack('a', [1, 4, 2]) + renderStack('b', [3, 9, 7, 5]);
      code.innerHTML = renderCode([], [7, 8, 9, 10]);
      action.innerHTML = '✅ pb terminé<br><span style="color:#6fb07e;">+ write(1, "pb\\n", 3)</span>';
      caption.innerHTML = "Le 3 a déménagé de A vers B. Aucune valeur n'a été copiée — c'est le <b>node lui-même</b> qui a changé de pile via une simple recâblage de pointeurs.";
    }
  },

  // 8. pa = même chose dans l'autre sens
  {
    dur: 8500,
    title: "pa = exactement la même chose",
    subtitle: "mais src et dst inversés",
    render: (stacks, code, action, caption) => {
      stacks.innerHTML = renderStack('a', [3, 9, 7, 5], 'A', 0) + renderStack('b', [1, 4, 2]);
      code.innerHTML = `
<span class="line"><span class="kw">void</span> <span class="fn">pa</span>(<span class="kw">t_stack</span> **a, <span class="kw">t_stack</span> **b)</span>
<span class="line">{</span>
<span class="line hl">  <span class="fn">push_top</span>(a, b);  <span class="com">// dst=a, src=b</span></span>
<span class="line">  write(<span class="kw">1</span>, <span style="color:#ffe96b;">"pa\\n"</span>, <span class="kw">3</span>);</span>
<span class="line">}</span>
<span class="line"></span>
<span class="line"><span class="kw">void</span> <span class="fn">pb</span>(<span class="kw">t_stack</span> **a, <span class="kw">t_stack</span> **b)</span>
<span class="line">{</span>
<span class="line">  <span class="fn">push_top</span>(b, a);  <span class="com">// dst=b, src=a</span></span>
<span class="line">  write(<span class="kw">1</span>, <span style="color:#ffe96b;">"pb\\n"</span>, <span class="kw">3</span>);</span>
<span class="line">}</span>`;
      action.innerHTML = 'pa = push_top(<b>a</b>, <b>b</b>)<br>pb = push_top(<b>b</b>, <b>a</b>)';
      caption.innerHTML = "Une seule fonction <code>push_top</code> fait tout le travail. <b>pa</b> et <b>pb</b> sont juste des wrappers qui appellent push_top avec dst/src inversés, puis affichent leur nom.";
    }
  },

  // 9. Récap final
  {
    dur: 7000,
    title: "Récap : 4 étapes, 4 lignes",
    subtitle: "tu peux maintenant écrire push_top",
    render: (stacks, code, action, caption) => {
      stacks.innerHTML = `
        <div style="text-align:center; font-family:'Caveat',cursive; font-size:32px; color:#ffe96b; line-height:1.6;">
          1️⃣ <b style="color:#f0e9d8;">attrape</b> le top de src<br>
          2️⃣ src <b style="color:#f0e9d8;">oublie</b> son top<br>
          3️⃣ top <b style="color:#f0e9d8;">se chaîne</b> à dst<br>
          4️⃣ dst <b style="color:#f0e9d8;">reconnaît</b> son nouveau top
        </div>`;
      code.innerHTML = renderCode([7, 8, 9, 10]);
      action.innerHTML = '4 étapes = 4 lignes de code.<br>Pas plus, pas moins.';
      caption.innerHTML = "À ton tour : ouvre <code>op_push.c</code>, vire la ligne <code>(void)top; (void)dst;</code>, écris ces 4 lignes à la place des TROUs.";
    }
  }
];

let currentScene = 0;
let timer = null;
let paused = false;
let startTime = 0;
let remainingTime = 0;

const titleEl = document.getElementById('title');
const subtitleEl = document.getElementById('subtitle');
const stacksEl = document.getElementById('stacks');
const codeBodyEl = document.getElementById('code-body');
const actionCardEl = document.getElementById('action-card');
const captionEl = document.getElementById('caption');
const progressEl = document.getElementById('progress');
const counterEl = document.getElementById('counter');

function playScene(idx) {
  if (idx >= SCENES.length) idx = 0;
  if (idx < 0) idx = SCENES.length - 1;
  currentScene = idx;
  const s = SCENES[idx];

  titleEl.classList.remove('in');
  captionEl.classList.remove('in');

  setTimeout(() => {
    titleEl.textContent = s.title;
    subtitleEl.textContent = s.subtitle || '';
    s.render(stacksEl, codeBodyEl, actionCardEl, captionEl);

    setTimeout(() => {
      titleEl.classList.add('in');
      setTimeout(() => captionEl.classList.add('in'), 200);
    }, 80);

    counterEl.textContent = `scène ${idx + 1} / ${SCENES.length}`;
    progressEl.style.width = ((idx + 1) / SCENES.length * 100) + '%';

    startTime = Date.now();
    remainingTime = s.dur;
    if (!paused) scheduleNext(s.dur);
  }, 350);
}

function scheduleNext(delay) {
  if (timer) clearTimeout(timer);
  timer = setTimeout(() => playScene(currentScene + 1), delay);
}

function togglePause() {
  paused = !paused;
  const btn = document.getElementById('btn-pause');
  btn.textContent = paused ? '▶ reprendre' : '⏸ pause';
  if (paused) {
    if (timer) clearTimeout(timer);
    remainingTime -= (Date.now() - startTime);
  } else {
    startTime = Date.now();
    scheduleNext(Math.max(remainingTime, 500));
  }
}

function replay() {
  paused = false;
  document.getElementById('btn-pause').textContent = '⏸ pause';
  if (timer) clearTimeout(timer);
  playScene(0);
}

function prev() {
  if (timer) clearTimeout(timer);
  playScene(currentScene - 1);
}

function next() {
  if (timer) clearTimeout(timer);
  playScene(currentScene + 1);
}

document.getElementById('btn-pause').addEventListener('click', togglePause);
document.getElementById('btn-replay').addEventListener('click', replay);
document.getElementById('btn-prev').addEventListener('click', prev);
document.getElementById('btn-next').addEventListener('click', next);

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); prev(); }
  if (e.code === 'ArrowRight') { e.preventDefault(); next(); }
  if (e.code === 'KeyR') { e.preventDefault(); replay(); }
});

playScene(0);
</script>

</body>
</html>
