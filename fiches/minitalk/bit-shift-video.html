<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bit shifts — &gt;&gt; et &lt;&lt; expliqués</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&family=Patrick+Hand&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f0e1a; color: #f0e9d8; font-family: 'Patrick Hand', cursive; min-height: 100vh; overflow: hidden; }

.video { width: 100vw; height: 100vh; display: flex; flex-direction: column; padding: 20px 32px 70px 32px; }

.chapter-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5c5a75; text-align: center; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 4px; }
.scene-title { font-family: 'Kalam', cursive; font-size: 32px; color: #ffe96b; text-align: center; margin-bottom: 4px; min-height: 40px; opacity: 0; transform: translateY(-15px); transition: all 0.6s ease; }
.scene-title.in { opacity: 1; transform: translateY(0); }
.subtitle { font-family: 'Caveat', cursive; font-size: 19px; color: #c0b3e0; text-align: center; margin-bottom: 14px; min-height: 22px; }

.main { flex: 1; display: flex; min-height: 0; align-items: center; justify-content: center; }
.stage-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 0 20px; max-width: 1300px; width: 100%; }

/* Bit shelf */
.shelf-container { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.shelf-row { display: flex; gap: 6px; }
.shelf-cell { width: 70px; height: 70px; border: 3px solid #5c5a75; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 700; color: #5c5a75; background: #1a1825; transition: all 0.5s ease; position: relative; }
.shelf-cell.zero { color: #ff9f7a; border-color: #ff9f7a; background: rgba(255,159,122,0.1); }
.shelf-cell.one { color: #79b8d8; border-color: #79b8d8; background: rgba(121,184,216,0.1); }
.shelf-cell.dropping { animation: drop 0.6s ease-out forwards; }
.shelf-cell.newzero { animation: appear 0.5s ease-out forwards; background: rgba(201,166,255,0.15); border-color: #c9a6ff; color: #c9a6ff; }
.shelf-cell.highlight { box-shadow: 0 0 24px currentColor; transform: scale(1.08); }
.shelf-cell.masked { opacity: 0.25; }
.shelf-cell.kept { box-shadow: 0 0 20px #ffe96b; border-color: #ffe96b; transform: scale(1.1); }

@keyframes drop {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(80px); opacity: 0; }
}
@keyframes appear {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.shelf-labels { display: flex; gap: 6px; }
.shelf-labels span { width: 70px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5c5a75; }
.shelf-weights { display: flex; gap: 6px; }
.shelf-weights span { width: 70px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #c0b3e0; }

/* Big text */
.big-text { font-family: 'Kalam', cursive; font-size: 24px; color: #ffe96b; text-align: center; line-height: 1.5; max-width: 1100px; }
.big-text code { font-family: 'JetBrains Mono', monospace; background: #2a2833; color: #ffb380; padding: 3px 10px; border-radius: 6px; font-size: 22px; }
.big-text b { color: #ff9f7a; }
.big-text .muted { color: #5c5a75; font-size: 17px; }
.big-text .ok { color: #6fb07e; }

/* Caption */
.caption { font-family: 'Patrick Hand', cursive; font-size: 20px; color: #f0e9d8; text-align: center; max-width: 1100px; line-height: 1.5; margin: 14px auto 0 auto; min-height: 50px; opacity: 0; transform: translateY(15px); transition: all 0.6s ease; }
.caption.in { opacity: 1; transform: translateY(0); }
.caption b { color: #ff9f7a; }
.caption code { font-family: 'JetBrains Mono', monospace; background: #2a2833; color: #ffb380; padding: 2px 8px; border-radius: 4px; font-size: 17px; }
.caption .hl { background: #ffe96b; color: #0f0e1a; padding: 2px 6px; border-radius: 3px; font-weight: 700; }

/* Operation label */
.op-label { font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #ffe96b; padding: 12px 24px; background: #1a1825; border: 2px solid #ffe96b; border-radius: 12px; display: inline-block; box-shadow: 4px 4px 0 rgba(255,233,107,0.3); }

/* Equation row */
.eq-row { display: flex; flex-direction: column; gap: 6px; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 18px; }
.eq-step { display: flex; gap: 12px; align-items: center; color: #c0b3e0; }
.eq-step .lab { color: #5c5a75; font-size: 14px; min-width: 100px; text-align: right; }
.eq-step .val { font-weight: 700; }
.eq-step .val.before { color: #c0b3e0; }
.eq-step .val.after { color: #ffe96b; }

/* Mask box */
.mask-explain { display: flex; flex-direction: column; gap: 4px; font-family: 'JetBrains Mono', monospace; font-size: 17px; padding: 16px 24px; background: #1a1825; border: 2px solid #2a2833; border-radius: 12px; }
.mask-explain .me-row { display: flex; gap: 12px; align-items: center; }
.mask-explain .me-row .lb { color: #5c5a75; min-width: 100px; text-align: right; }
.mask-explain .me-row .v { color: #c0b3e0; letter-spacing: 4px; font-weight: 700; }
.mask-explain .me-row .v.mask { color: #c9a6ff; }
.mask-explain .me-row .v.result { color: #ffe96b; }
.mask-explain hr { border: none; border-top: 1px dashed #5c5a75; margin: 4px 0; }

/* Practice grid */
.practice-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.practice-cell { padding: 10px 12px; background: #1a1825; border: 2px solid #2a2833; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; text-align: center; color: #c0b3e0; }
.practice-cell .step { color: #5c5a75; font-size: 10px; margin-bottom: 4px; }
.practice-cell .val { color: #ffe96b; font-size: 14px; font-weight: 700; }
.practice-cell .res { color: #6fb07e; font-size: 16px; font-weight: 700; margin-top: 4px; }

/* Controls */
.progress { position: fixed; bottom: 0; left: 0; height: 4px; background: #ffe96b; transition: width 0.2s linear; }
.controls { position: fixed; bottom: 14px; right: 14px; display: flex; gap: 8px; }
.controls button { font-family: 'Kalam', cursive; font-weight: 700; font-size: 14px; background: #2a2833; color: #f0e9d8; border: 2px solid #f0e9d8; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.controls button:hover { background: #ffe96b; color: #0f0e1a; }
.scene-counter { position: fixed; bottom: 18px; left: 20px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #5c5a75; }
.keyhint { position: fixed; bottom: 42px; left: 20px; font-family: 'Caveat', cursive; font-size: 13px; color: #3a3849; }

.chapter-banner { font-family: 'Kalam', cursive; font-size: 38px; color: #c9a6ff; text-align: center; padding: 20px; border: 3px dashed #c9a6ff; border-radius: 16px; max-width: 700px; background: rgba(201,166,255,0.05); }
.chapter-num { font-size: 18px; color: #5c5a75; letter-spacing: 4px; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="video">
  <div class="chapter-tag" id="chapter-tag">part 1</div>
  <div class="scene-title" id="title">Bit shifts</div>
  <div class="subtitle" id="subtitle"></div>
  <div class="main">
    <div class="stage-wrap" id="stage"></div>
  </div>
  <div class="caption" id="caption"></div>
</div>

<div class="progress" id="progress"></div>
<div class="scene-counter" id="counter">scène 1 / ?</div>
<div class="keyhint">← prev · space pause · → next</div>
<div class="controls">
  <button id="btn-prev">⏮ prev</button>
  <button id="btn-pause">⏸ pause</button>
  <button id="btn-next">⏭ next</button>
  <button id="btn-replay">↺ replay</button>
</div>

<script>
// Render 8 bits as shelf cells
function shelf(bits, opts={}) {
  const labels = opts.labels !== false;
  const weights = opts.weights || false;
  const masked = opts.masked || [];
  const kept = opts.kept || [];
  const highlight = opts.highlight || [];
  const dropping = opts.dropping || [];
  const newzero = opts.newzero || [];

  let h = '<div class="shelf-container">';
  if (weights) {
    h += '<div class="shelf-weights">';
    h += '<span>128</span><span>64</span><span>32</span><span>16</span><span>8</span><span>4</span><span>2</span><span>1</span>';
    h += '</div>';
  }
  h += '<div class="shelf-row">';
  bits.forEach((b, i) => {
    let cls = 'shelf-cell ' + (b === '0' ? 'zero' : b === '1' ? 'one' : '');
    if (masked.includes(i)) cls += ' masked';
    if (kept.includes(i)) cls += ' kept';
    if (highlight.includes(i)) cls += ' highlight';
    if (dropping.includes(i)) cls += ' dropping';
    if (newzero.includes(i)) cls += ' newzero';
    h += `<div class="${cls}">${b}</div>`;
  });
  h += '</div>';
  if (labels) {
    h += '<div class="shelf-labels">';
    h += '<span>bit 7</span><span>bit 6</span><span>bit 5</span><span>bit 4</span><span>bit 3</span><span>bit 2</span><span>bit 1</span><span>bit 0</span>';
    h += '</div>';
  }
  h += '</div>';
  return h;
}

const SCENES = [
  // ═══════════ PART 1 — INTRO ═══════════
  {
    chapter: 'part 1 / 4 — concept de base',
    dur: 6500,
    title: '',
    subtitle: '',
    render: (stage, caption) => {
      stage.innerHTML = `
        <div class="chapter-banner">
          <div class="chapter-num">PART 1 / 4</div>
          C'est quoi un<br><b style="color:#ffe96b">bit shift</b> ?<br>
          <span style="font-size:16px; color:#5c5a75;">on déplace les bits, point.</span>
        </div>`;
      caption.innerHTML = "Le bit shift (<code>&gt;&gt;</code> ou <code>&lt;&lt;</code>) c'est juste <b>déplacer les bits d'une variable</b>. Tu vas voir, c'est super visuel.";
    }
  },

  {
    chapter: 'part 1 / 4 — concept de base',
    dur: 8500,
    title: "L'étagère à 8 cases",
    subtitle: "imagine un char comme une étagère de 8 cases (8 bits)",
    render: (stage, caption) => {
      stage.innerHTML = `
        <div class="big-text">
          Un <code>char</code> en C = <b>8 cases</b>, chacune contenant <b>0</b> ou <b>1</b>.
        </div>
        ${shelf(['0','1','0','1','0','0','1','1'], {weights: true})}
        <div class="big-text" style="font-size:20px;">
          'S' = <code>83</code> = <code>01010011</code>
        </div>`;
      caption.innerHTML = "8 cases, 8 positions. Chaque position a un <b>poids</b> (puissance de 2). En additionnant les poids des cases avec un 1, on obtient la valeur : 64+16+2+1 = 83 = 'S'.";
    }
  },

  // ═══════════ PART 2 — SHIFT DROIT ═══════════
  {
    chapter: 'part 2 / 4 — shift droit >>',
    dur: 6000,
    title: '',
    subtitle: '',
    render: (stage, caption) => {
      stage.innerHTML = `
        <div class="chapter-banner">
          <div class="chapter-num">PART 2 / 4</div>
          Le shift droit<br><b style="color:#ff9f7a; font-size:48px;">&gt;&gt;</b><br>
          <span style="font-size:16px; color:#5c5a75;">décale les bits vers la droite</span>
        </div>`;
      caption.innerHTML = "On va commencer par <code>&gt;&gt;</code> (shift droit). C'est celui qu'on utilise <b>côté client</b> pour extraire les bits d'un char à envoyer.";
    }
  },

  {
    chapter: 'part 2 / 4 — shift droit >>',
    dur: 10000,
    title: "c >> 1 — étape par étape",
    subtitle: "tout glisse d'1 cran à droite",
    render: (stage, caption) => {
      stage.innerHTML = `
        <div class="op-label">c &gt;&gt; 1</div>
        <div class="big-text" style="font-size:18px; color:#5c5a75;">AVANT (c = 'S' = 83) :</div>
        ${shelf(['0','1','0','1','0','0','1','1'])}
        <div style="font-size:32px; color:#c9a6ff;">↓ on décale d'1 case à droite ↓</div>
        <div class="big-text" style="font-size:18px; color:#5c5a75;">APRÈS :</div>
        ${shelf(['0','0','1','0','1','0','0','1'], {newzero: [0], dropping: []})}
        <div class="big-text" style="font-size:18px;">
          • Le <b>1</b> tout à droite est <b>tombé</b> (perdu)<br>
          • Tous les autres ont glissé d'1 cran à droite<br>
          • À gauche, on met un <b style="color:#c9a6ff">0</b> tout neuf<br>
          <span class="muted">résultat = 41 (= 83 / 2 arrondi)</span>
        </div>`;
      caption.innerHTML = "Chaque shift droit d'1 cran <b>divise par 2</b> (et le bit de droite est perdu). C'est comme faire glisser tous les livres d'une étagère vers la droite, le dernier livre tombe.";
    }
  },

  {
    chapter: 'part 2 / 4 — shift droit >>',
    dur: 11000,
    title: "c >> 2 — on recommence 2 fois",
    subtitle: "shifter de 2 = shifter de 1, puis encore de 1",
    render: (stage, caption) => {
      stage.innerHTML = `
        <div class="op-label">c &gt;&gt; 2</div>
        <div class="eq-row">
          <div class="eq-step"><span class="lab">départ :</span><span class="val before">0 1 0 1 0 0 1 1</span><span style="color:#5c5a75;">= 83</span></div>
          <div class="eq-step"><span class="lab">&gt;&gt; 1 :</span><span class="val before">0 0 1 0 1 0 0 1</span><span style="color:#5c5a75;">= 41</span></div>
          <div class="eq-step"><span class="lab">&gt;&gt; 2 :</span><span class="val after">0 0 0 1 0 1 0 0</span><span style="color:#6fb07e;">= 20 ✓</span></div>
        </div>
        ${shelf(['0','0','0','1','0','1','0','0'], {newzero: [0,1]})}
        <div class="big-text" style="font-size:18px;">
          2 bits sont tombés à droite (les deux <b>1</b> de fin)<br>
          2 zéros sont apparus à gauche
        </div>`;
      caption.innerHTML = "<code>c &gt;&gt; 2</code> = même opération, 2 fois. Tu peux toujours décomposer : <code>c &gt;&gt; n</code> = appliquer le shift n fois.";
    }
  },

  {
    chapter: 'part 2 / 4 — shift droit >>',
    dur: 12000,
    title: "c >> 7 — ce qu'on cherche vraiment",
    subtitle: "ça amène le bit 7 (MSB) en position 0",
    render: (stage, caption) => {
      stage.innerHTML = `
        <div class="op-label">c &gt;&gt; 7</div>
        <div class="big-text" style="font-size:18px; color:#5c5a75;">départ — le bit 7 c'est le <span style="color:#ffe96b">0</span> à gauche :</div>
        ${shelf(['0','1','0','1','0','0','1','1'], {highlight: [0]})}
        <div style="font-size:30px; color:#c9a6ff;">↓ 7 décalages ↓</div>
        ${shelf(['0','0','0','0','0','0','0','0'], {highlight: [7]})}
        <div class="big-text" style="font-size:18px;">
          7 bits sont tombés à droite, tous les autres ont disparu.<br>
          Il ne reste plus que le <b style="color:#ffe96b">bit 7 original</b>,<br>
          maintenant en position 0 (case de droite).<br>
          <span class="ok">Résultat = 0 (le bit 7 de 'S' valait 0)</span>
        </div>`;
      caption.innerHTML = "<b>C'est l'astuce !</b> Après <code>c &gt;&gt; 7</code>, le bit qui était à la position 7 se retrouve seul en position 0. On peut maintenant tester sa valeur. <b>Pareil pour n'importe quelle position</b> : <code>c &gt;&gt; i</code> amène le bit i en position 0.";
    }
  },

  // ═══════════ PART 3 — LE MASQUE & 1 ═══════════
  {
    chapter: 'part 3 / 4 — le masque & 1',
    dur: 6000,
    title: '',
    subtitle: '',
    render: (stage, caption) => {
      stage.innerHTML = `
        <div class="chapter-banner">
          <div class="chapter-num">PART 3 / 4</div>
          Le masque<br><b style="color:#c9a6ff; font-size:48px;">&amp; 1</b><br>
          <span style="font-size:16px; color:#5c5a75;">garde uniquement le bit de droite</span>
        </div>`;
      caption.innerHTML = "Le shift seul ne suffit pas. Si on veut extraire <b>juste 0 ou 1</b>, il faut <b>effacer tous les autres bits</b>. C'est le rôle de <code>&amp; 1</code>.";
    }
  },

  {
    chapter: 'part 3 / 4 — le masque & 1',
    dur: 11000,
    title: "C'est quoi & (AND bitwise) ?",
    subtitle: "comparer 2 nombres bit à bit",
    render: (stage, caption) => {
      stage.innerHTML = `
        <div class="big-text" style="font-size:18px;">
          L'opérateur <code>&amp;</code> compare 2 nombres <b>bit par bit</b> :<br>
          Résultat = 1 <b>seulement si les deux bits sont 1</b>.
        </div>
        <div class="mask-explain">
          <div class="me-row"><span class="lb">A =</span><span class="v">1 0 1 0 1 0 1 0</span></div>
          <div class="me-row"><span class="lb">B =</span><span class="v">1 1 0 0 1 1 0 0</span></div>
          <hr>
          <div class="me-row"><span class="lb">A &amp; B =</span><span class="v result">1 0 0 0 1 0 0 0</span></div>
        </div>
        <div class="big-text" style="font-size:16px; color:#c0b3e0;">
          position 7 : 1 &amp; 1 = <b style="color:#6fb07e">1</b><br>
          position 6 : 0 &amp; 1 = <b style="color:#ff7a7a">0</b><br>
          position 5 : 1 &amp; 0 = <b style="color:#ff7a7a">0</b><br>
          ... etc
        </div>`;
      caption.innerHTML = "C'est comme un ET logique appliqué à chaque paire de bits. <b>1 ET 1 = 1</b>, sinon 0. Ça permet de \"filtrer\" des bits.";
    }
  },

  {
    chapter: 'part 3 / 4 — le masque & 1',
    dur: 12000,
    title: "& 1 = filtre qui garde uniquement le bit 0",
    subtitle: "le nombre 1 c'est 00000001 en binaire",
    render: (stage, caption) => {
      stage.innerHTML = `
        <div class="big-text" style="font-size:18px;">
          Le nombre <code>1</code> en binaire 8 bits = <code>00000001</code><br>
          (uniquement le bit de droite est à 1)
        </div>
        <div class="mask-explain">
          <div class="me-row"><span class="lb">n'importe quoi :</span><span class="v">0 1 0 1 0 0 1 1</span></div>
          <div class="me-row"><span class="lb">&amp; 1 :</span><span class="v mask">0 0 0 0 0 0 0 1</span></div>
          <hr>
          <div class="me-row"><span class="lb">résultat :</span><span class="v result">0 0 0 0 0 0 0 1</span></div>
        </div>
        <div class="big-text" style="font-size:16px;">
          ➜ Tous les bits à gauche sont <b>écrasés à 0</b> (parce que le masque a des 0 partout).<br>
          ➜ Le bit 0 (à droite) est <b>préservé</b> si c'était un 1, ou reste 0.<br>
          <b class="ok">Le résultat est donc 0 ou 1, selon la valeur du bit 0.</b>
        </div>`;
      caption.innerHTML = "<b>&amp; 1 = je garde seulement la position 0.</b> Tout le reste passe à zéro. C'est exactement ce qu'on veut après le shift : extraire la valeur 0 ou 1 du bit qui nous intéresse.";
    }
  },

  // ═══════════ PART 4 — LA FORMULE COMPLÈTE ═══════════
  {
    chapter: 'part 4 / 4 — (c >> i) & 1',
    dur: 6000,
    title: '',
    subtitle: '',
    render: (stage, caption) => {
      stage.innerHTML = `
        <div class="chapter-banner">
          <div class="chapter-num">PART 4 / 4</div>
          La formule magique<br><br>
          <code style="font-family:'JetBrains Mono',monospace; font-size:36px; color:#ffe96b; background:#1a1825; padding:8px 16px; border-radius:8px;">(c &gt;&gt; i) &amp; 1</code><br>
          <span style="font-size:16px; color:#5c5a75; margin-top:12px; display:inline-block;">extrait le bit à la position i</span>
        </div>`;
      caption.innerHTML = "On combine les 2 outils : <b>shift</b> pour amener le bit i en position 0, <b>masque &amp; 1</b> pour ne garder que ce bit. Résultat : <code>0</code> ou <code>1</code>.";
    }
  },

  {
    chapter: 'part 4 / 4 — (c >> i) & 1',
    dur: 13000,
    title: "Décomposition complète",
    subtitle: "extraire le bit 6 de 'S' = (c >> 6) & 1",
    render: (stage, caption) => {
      stage.innerHTML = `
        <div class="op-label">étape 1 : c &gt;&gt; 6</div>
        ${shelf(['0','1','0','1','0','0','1','1'], {highlight: [1], labels: false})}
        <div style="font-size:24px; color:#c9a6ff;">↓ shift de 6 ↓</div>
        ${shelf(['0','0','0','0','0','0','0','1'], {highlight: [7], labels: false})}
        <div class="big-text" style="font-size:16px;">le bit 6 original (= 1) est maintenant en position 0</div>
        <div class="op-label">étape 2 : &amp; 1</div>
        <div class="mask-explain" style="font-size:15px;">
          <div class="me-row"><span class="lb">après shift :</span><span class="v">0 0 0 0 0 0 0 1</span></div>
          <div class="me-row"><span class="lb">&amp; 1 :</span><span class="v mask">0 0 0 0 0 0 0 1</span></div>
          <hr>
          <div class="me-row"><span class="lb">résultat :</span><span class="v result">0 0 0 0 0 0 0 1 = 1 ✓</span></div>
        </div>`;
      caption.innerHTML = "Le bit 6 de 'S' (01010011) vaut <b>1</b>. La formule (c &gt;&gt; 6) &amp; 1 = 1. ✅ Tu peux faire pareil pour n'importe quelle position de 0 à 7.";
    }
  },

  {
    chapter: 'part 4 / 4 — (c >> i) & 1',
    dur: 13000,
    title: "Pratique — extraire les 8 bits de 'S'",
    subtitle: "boucle de i=7 à i=0",
    render: (stage, caption) => {
      stage.innerHTML = `
        <div class="big-text" style="font-size:18px;">

        <div class="big-text" style="font-size:18px;">
          Bits extraits dans l'ordre : <code>0 1 0 1 0 0 1 1</code> = 'S' ✓<br>
          <span class="muted">→ 8 signaux à envoyer au server (SIGUSR1 pour 0, SIGUSR2 pour 1)</span>
        </div>`;
      caption.innerHTML = "Voilà ce que fait le client minitalk pour <b>chaque caractère</b>. Une boucle de 7 à 0, extrait chaque bit, envoie le signal correspondant. <b>C'est tout.</b>";
    }
  },

  // ═══════════ BONUS — SHIFT GAUCHE ═══════════
  {
    chapter: 'bonus — shift gauche <<',
    dur: 11000,
    title: "Le shift gauche << — l'inverse",
    subtitle: "côté server : pour reconstruire le char bit par bit",
    render: (stage, caption) => {
      stage.innerHTML = `
        <div class="op-label">c &lt;&lt; 1</div>
        <div class="big-text" style="font-size:18px; color:#5c5a75;">AVANT :</div>
        ${shelf(['0','0','0','0','1','0','1','0'])}
        <div style="font-size:30px; color:#c9a6ff;">↓ tout glisse vers la GAUCHE ↓</div>
        ${shelf(['0','0','0','1','0','1','0','0'], {newzero: [7]})}
        <div class="big-text" style="font-size:18px;">
          • Le bit de gauche tombe (perdu)<br>
          • Tous les autres glissent d'1 cran à <b style="color:#c9a6ff">gauche</b><br>
          • À droite on met un <b style="color:#c9a6ff">0</b> tout neuf<br>
          <span class="muted">c'est <b>l'inverse exact</b> du shift droit</span>
        </div>`;
      caption.innerHTML = "<code>&lt;&lt;</code> fait <b>l'inverse</b> de <code>&gt;&gt;</code>. On glisse à gauche, le 0 apparaît à droite. Mathématiquement : c'est <b>multiplier par 2</b>.";
    }
  },

  {
    chapter: 'bonus — shift gauche <<',
    dur: 13000,
    title: "Reconstruire un char : (c << 1) | bit",
    subtitle: "côté server, chaque signal reçu = 1 bit",
    render: (stage, caption) => {
      stage.innerHTML = `
        <div class="big-text" style="font-size:18px;">
          On reçoit les bits dans l'ordre : <code>0 → 1 → 0 → 1 → 0 → 0 → 1 → 1</code>
        </div>
        <div class="practice-grid" style="grid-template-columns: repeat(4, 1fr);">
          <div class="practice-cell"><div class="step">reçu : 0</div><div class="val">c=(0&lt;&lt;1)|0</div><div class="res">c=0</div></div>
          <div class="practice-cell"><div class="step">reçu : 1</div><div class="val">c=(0&lt;&lt;1)|1</div><div class="res">c=1</div></div>
          <div class="practice-cell"><div class="step">reçu : 0</div><div class="val">c=(1&lt;&lt;1)|0</div><div class="res">c=2 (10)</div></div>
          <div class="practice-cell"><div class="step">reçu : 1</div><div class="val">c=(2&lt;&lt;1)|1</div><div class="res">c=5 (101)</div></div>
          <div class="practice-cell"><div class="step">reçu : 0</div><div class="val">c=(5&lt;&lt;1)|0</div><div class="res">c=10 (1010)</div></div>
          <div class="practice-cell"><div class="step">reçu : 0</div><div class="val">c=(10&lt;&lt;1)|0</div><div class="res">c=20 (10100)</div></div>

          <div class="practice-cell"><div class="step">reçu : 1</div><div class="val">c=(41&lt;&lt;1)|1</div><div class="res">c=83 ('S') ✓</div></div>

        <div class="big-text" style="font-size:18px;">

        </div>`;
      caption.innerHTML = "<b>&lt;&lt; 1</b> fait de la place à droite, <b>| bit</b> y met le nouveau bit reçu. Après 8 itérations, on a reconstruit le char original. C'est <b>l'opération miroir</b> du shift droit côté client.";
    }
  },

  // ═══════════ RECAP ═══════════
  {
    chapter: 'récap',
    dur: 11000,
    title: "✅ Récap — les 2 formules à connaître",
    subtitle: "côté client + côté server",
    render: (stage, caption) => {
      stage.innerHTML = `
        <div style="display: flex; gap: 30px; flex-wrap: wrap; justify-content: center;">

              • <b>shift</b> amène le bit i en position 0<br>

              • résultat = 0 ou 1
            </div>

          <div style="background: rgba(111,176,126,0.08); border: 2px solid #6fb07e; border-radius: 12px; padding: 20px 28px; max-width: 480px;">
            <div style="font-family:'Kalam',cursive; font-size:22px; color:#6fb07e; margin-bottom:10px;">CÔTÉ SERVER — reconstruire</div>
            <div style="font-family:'JetBrains Mono',monospace; font-size:24px; color:#ffe96b; text-align:center; padding:12px; background:#1a1825; border-radius:8px;">c = (c &lt;&lt; 1) | bit</div>
            <div style="font-family:'Patrick Hand',cursive; font-size:16px; color:#c0b3e0; margin-top:10px; line-height:1.5;">
              Pour chaque bit reçu :<br>
              • <b>&lt;&lt;</b> fait de la place à droite<br>
              • <b>|</b> y met le nouveau bit<br>
              • après 8 bits → char complet
            </div>
          </div>
        </div>
        <div class="big-text" style="font-size:18px;">
          ✨ Ces 2 lignes sont <b>au cœur de minitalk</b>. <br>Le reste c'est de la plomberie (signaux, kill, pause, ACK).
        </div>`;
      caption.innerHTML = "Mémorise ces 2 formules. <b>Si tu peux expliquer ces 2 lignes</b> à un évaluateur en defense, tu démontres que tu maîtrises la mécanique fondamentale du projet.";
    }
  },
];

let currentScene = 0;
let timer = null;
let paused = false;
let startTime = 0;
let remainingTime = 0;

const titleEl = document.getElementById('title');
const chapterEl = document.getElementById('chapter-tag');
const subtitleEl = document.getElementById('subtitle');
const stageEl = document.getElementById('stage');
const captionEl = document.getElementById('caption');
const progressEl = document.getElementById('progress');
const counterEl = document.getElementById('counter');

function playScene(idx) {
  if (idx >= SCENES.length) idx = 0;
  if (idx < 0) idx = SCENES.length - 1;
  currentScene = idx;
  const s = SCENES[idx];

  titleEl.classList.remove('in');
  captionEl.classList.remove('in');

  setTimeout(() => {
    chapterEl.textContent = s.chapter || '';
    titleEl.textContent = s.title;
    subtitleEl.textContent = s.subtitle || '';
    s.render(stageEl, captionEl);
    setTimeout(() => { titleEl.classList.add('in'); setTimeout(() => captionEl.classList.add('in'), 200); }, 80);
    counterEl.textContent = `scène ${idx + 1} / ${SCENES.length}`;
    progressEl.style.width = ((idx + 1) / SCENES.length * 100) + '%';
    startTime = Date.now();
    remainingTime = s.dur;
    if (!paused) scheduleNext(s.dur);
  }, 350);
}

function scheduleNext(d) { if (timer) clearTimeout(timer); timer = setTimeout(() => playScene(currentScene + 1), d); }
function togglePause() {
  paused = !paused;
  document.getElementById('btn-pause').textContent = paused ? '▶ reprendre' : '⏸ pause';
  if (paused) { if (timer) clearTimeout(timer); remainingTime -= (Date.now() - startTime); }
  else { startTime = Date.now(); scheduleNext(Math.max(remainingTime, 500)); }
}
function replay() { paused = false; document.getElementById('btn-pause').textContent = '⏸ pause'; if (timer) clearTimeout(timer); playScene(0); }
function prev() { if (timer) clearTimeout(timer); playScene(currentScene - 1); }
function next() { if (timer) clearTimeout(timer); playScene(currentScene + 1); }

document.getElementById('btn-pause').addEventListener('click', togglePause);
document.getElementById('btn-replay').addEventListener('click', replay);
document.getElementById('btn-prev').addEventListener('click', prev);
document.getElementById('btn-next').addEventListener('click', next);
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); prev(); }
  if (e.code === 'ArrowRight') { e.preventDefault(); next(); }
  if (e.code === 'KeyR') { e.preventDefault(); replay(); }
});

playScene(0);
</script>
