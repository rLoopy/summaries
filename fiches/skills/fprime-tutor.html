<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fprime — step debugger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&family=Patrick+Hand&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../zine.css?v=2">
<style>
main { max-width: 1400px !important; }
.debugger { background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; padding: 20px; box-shadow: 6px 6px 0 var(--ink); margin: 20px 0; }
.dbg-grid { display: grid; grid-template-columns: 1.8fr 1fr; gap: 18px; margin-bottom: 18px; }
@media (max-width: 1100px) { .dbg-grid { grid-template-columns: 1fr; } }
.code-panel { background: #1C1A28; border-radius: 12px; border: 2.5px solid var(--ink); overflow: hidden; box-shadow: 3px 3px 0 var(--ink); max-height: 700px; overflow-y: auto; }
.code-header { background: #262333; padding: 10px 14px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid rgba(255,255,255,0.06); position: sticky; top: 0; z-index: 2; }
.code-header .dot { width: 11px; height: 11px; border-radius: 50%; }
.code-header .title { margin-left: auto; font-family: 'JetBrains Mono', monospace; color: rgba(255,255,255,0.5); font-size: 12px; }
.code-body { padding: 14px 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.7; color: #E9E5F0; counter-reset: lineno; overflow-x: auto; }
.code-line { padding: 2px 20px 2px 44px; position: relative; white-space: pre; transition: background 0.15s; min-width: max-content; }
.code-line::before { counter-increment: lineno; content: counter(lineno); position: absolute; left: 8px; color: #5C5A75; font-size: 10px; width: 24px; text-align: right; }
.code-line.active { background: rgba(255, 233, 107, 0.22); border-left: 3px solid var(--hl-yellow); padding-left: 41px; }
.code-line.active::before { color: var(--hl-yellow); font-weight: 700; }
.kw { color: #A5D8A8; } .tp { color: #79B8D8; } .fn { color: #C0B3E0; }
.str { color: #FFD88A; } .num { color: #FFB380; } .cm { color: #5C5A75; font-style: italic; }

.state-panel { display: flex; flex-direction: column; gap: 12px; }
.vars-box, .out-box { border: 2.5px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); padding: 12px 14px; }
.vars-box { background: var(--paper); }
.out-box { background: #1C1A28; }
.vars-title { font-family: 'Kalam', cursive; font-weight: 700; font-size: 14px; color: var(--ink); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
.var-row { display: flex; align-items: center; gap: 8px; padding: 5px 7px; background: var(--paper-d); border: 2px solid var(--ink); border-radius: 7px; margin-bottom: 5px; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
.var-name { color: var(--accent-d); font-weight: 700; min-width: 55px; }
.var-eq { color: var(--muted); }
.var-val { color: var(--ink); font-weight: 700; padding: 2px 7px; background: var(--hl-yellow); border: 1.5px solid var(--ink); border-radius: 4px; min-width: 28px; text-align: center; }
.var-val.null { color: var(--muted); background: var(--paper-e); font-style: italic; }

.out-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #9DD6A8; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
.out-text { font-family: 'JetBrains Mono', monospace; font-size: 18px; color: #FF9F7A; font-weight: 700; min-height: 24px; white-space: pre; }

.desc-box { background: var(--ink); color: var(--paper); border-radius: 12px; border: 2.5px solid var(--ink); box-shadow: 3px 3px 0 var(--accent); padding: 12px 14px; font-family: 'Patrick Hand', cursive; font-size: 16px; line-height: 1.4; min-height: 50px; }
.desc-box .tag { display: inline-block; background: var(--hl-yellow); color: var(--ink); font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 4px; margin-right: 7px; text-transform: uppercase; letter-spacing: 1px; }

.ctrls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; }
.ctrl-btn { font-family: 'Kalam', cursive; font-weight: 700; font-size: 16px; background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 22px; padding: 8px 16px; box-shadow: 3px 3px 0 var(--ink); cursor: pointer; transition: all 0.15s; }
.ctrl-btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.ctrl-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.ctrl-btn.primary { background: var(--accent); color: #fff; }
.step-counter { font-family: 'Caveat', cursive; font-size: 20px; color: var(--ink-soft); text-align: center; margin-top: 12px; font-weight: 700; }
.step-counter .num { color: var(--accent-d); font-size: 24px; }
.examples { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
.ex-chip { font-family: 'JetBrains Mono', monospace; font-size: 12px; background: var(--paper); border: 2px solid var(--ink); border-radius: 18px; padding: 6px 12px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); transition: transform 0.1s; }
.ex-chip:hover { transform: translateY(-2px); }
.ex-chip.active { background: var(--hl-yellow); }
</style>
</head>
<body>

<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
  </defs>
</svg>

<div id="progress-bar"></div>

<div class="band">
  <span class="band-l">★ fprime — step debugger</span>
  <span class="band-r">by loopy · 2026</span>
</div>

<section class="hero">
  <span class="hero-stars s1">✦</span>
  <span class="hero-stars s2">★</span>
  <div class="hero-title"><span class="word">fprime</span></div>
  <div style="font-family:'Caveat',cursive;font-size:28px;color:var(--ink-soft);transform:rotate(-1deg);display:inline-block;margin-top:10px;">step by step ↓</div>
  <p class="hero-sub">Factorisation en premiers. Regarde <code style="font-family:'JetBrains Mono',monospace;background:var(--hl-yellow);padding:1px 6px;border:1.5px solid var(--ink);border-radius:3px;">n</code> se décomposer et <code style="font-family:'JetBrains Mono',monospace;background:var(--hl-yellow);padding:1px 6px;border:1.5px solid var(--ink);border-radius:3px;">div</code> monter. <span class="hl">8 exemples</span>.</p>
</section>

<main>

<section class="section fade">
  <div class="debugger">
    <div class="examples" id="examples"></div>

    <div class="dbg-grid">
      <div class="code-panel">
        <div class="code-header">
          <div class="dot" style="background:#FF6B6B"></div>
          <div class="dot" style="background:#FFD26A"></div>
          <div class="dot" style="background:#7ECE7E"></div>
          <div class="title">fprime.c</div>
        </div>
        <div class="code-body" id="code-body"></div>
      </div>

      <div class="state-panel">
        <div class="vars-box">
          <div class="vars-title">variables</div>
          <div class="var-row"><span class="var-name">argc</span><span class="var-eq">=</span><span class="var-val" id="v-argc">-</span></div>
          <div class="var-row"><span class="var-name">n</span><span class="var-eq">=</span><span class="var-val null" id="v-n">-</span></div>
          <div class="var-row"><span class="var-name">div</span><span class="var-eq">=</span><span class="var-val null" id="v-div">-</span></div>
        </div>

        <div class="out-box">
          <div class="out-label">stdout</div>
          <div class="out-text" id="out-text">—</div>
        </div>
      </div>
    </div>

    <div class="desc-box" id="desc-box">
      <span class="tag" id="desc-tag">ready</span>
      <span id="desc-text">Choisis un nbr et clique next.</span>
    </div>

    <div class="ctrls" style="margin-top:14px;">
      <button class="ctrl-btn" id="btn-prev">◀ prev</button>
      <button class="ctrl-btn primary" id="btn-next">next ▶</button>
      <button class="ctrl-btn" id="btn-play">▶ play</button>
      <button class="ctrl-btn" id="btn-reset">↺ reset</button>
      <label style="display:flex;align-items:center;gap:6px;font-family:'Patrick Hand',cursive;font-size:14px;">
        vitesse : <input type="range" id="speed" min="150" max="1800" value="700" step="50">
      </label>
    </div>

    <div class="step-counter">étape <span class="num" id="step-n">0</span> / <span id="step-total">0</span></div>
  </div>
</section>

</main>

<footer>
  <div class="footer-sig">factorisation pigée ✌</div>
  <div class="footer-meta">rank 02 · level 3 · <a href="fprime.html">zine</a></div>
</footer>

<script>
const CODE = [
  '<span class="cm">#include &lt;stdio.h&gt;</span>',
  '<span class="cm">#include &lt;stdlib.h&gt;</span>',
  '',
  '<span class="tp">int</span> <span class="fn">main</span>(<span class="tp">int</span> argc, <span class="tp">char</span> **argv)',
  '{',
  '\t<span class="kw">if</span> (argc != <span class="num">2</span>)',
  '\t{',
  '\t\t<span class="fn">printf</span>(<span class="str">"\\n"</span>);',
  '\t\t<span class="kw">return</span> <span class="num">0</span>;',
  '\t}',
  '\t<span class="tp">int</span> n = <span class="fn">atoi</span>(argv[<span class="num">1</span>]);',
  '\t<span class="kw">if</span> (n &lt; <span class="num">2</span>)',
  '\t{',
  '\t\t<span class="fn">printf</span>(<span class="str">"%d\\n"</span>, n);',
  '\t\t<span class="kw">return</span> <span class="num">0</span>;',
  '\t}',
  '\t<span class="tp">int</span> div = <span class="num">2</span>;',
  '\t<span class="kw">while</span> (n &gt; <span class="num">1</span>)',
  '\t{',
  '\t\t<span class="kw">if</span> (n % div == <span class="num">0</span>)',
  '\t\t{',
  '\t\t\t<span class="fn">printf</span>(<span class="str">"%d"</span>, div);',
  '\t\t\tn /= div;',
  '\t\t\t<span class="kw">if</span> (n &gt; <span class="num">1</span>)',
  '\t\t\t\t<span class="fn">printf</span>(<span class="str">"*"</span>);',
  '\t\t}',
  '\t\t<span class="kw">else</span>',
  '\t\t\tdiv++;',
  '\t}',
  '\t<span class="fn">printf</span>(<span class="str">"\\n"</span>);',
  '\t<span class="kw">return</span> <span class="num">0</span>;',
  '}',
];

const LN = {
  checkArgc: 6, argcPrint: 8, argcRet: 9,
  parseN: 11,
  checkN2: 12, smallPrint: 14, smallRet: 15,
  divInit: 17,
  outerW: 18,
  ifMod: 20, writeDiv: 22, divideN: 23, ifMore: 24, writeStar: 25,
  divInc: 27,
  finalNL: 29,
};

function genFrames(nbr, argc) {
  const frames = [];
  let n = null, div = null, out = '';
  const snap = (line, tag, desc) => frames.push({ line, tag, desc, vars: { argc, n, div }, out });

  snap(LN.checkArgc, 'check', `argc = ${argc}. argc != 2 ? ${argc !== 2 ? 'OUI' : 'non'}`);
  if (argc !== 2) {
    out += '\n';
    snap(LN.argcPrint, 'write', `printf("\\n") → newline`);
    snap(LN.argcRet, 'exit', `return 0 → fini`);
    return frames;
  }

  n = nbr;
  snap(LN.parseN, 'assign', `n = atoi(argv[1]) = ${n}`);

  snap(LN.checkN2, 'check', `n < 2 ? ${n < 2 ? 'OUI' : 'non'}`);
  if (n < 2) {
    out += `${n}\n`;
    snap(LN.smallPrint, 'write', `printf("%d\\n", n) → "${n}"`);
    snap(LN.smallRet, 'exit', `return 0 → fini`);
    return frames;
  }

  div = 2;
  snap(LN.divInit, 'assign', `div = 2 (le plus petit premier)`);

  snap(LN.outerW, 'check', `n > 1 ? ${n > 1 ? 'OUI, on entre' : 'non, on sort'}`);
  while (n > 1) {
    snap(LN.ifMod, 'check', `n % div = ${n % div}. Divisible ? ${n % div === 0 ? 'OUI' : 'non'}`);
    if (n % div === 0) {
      out += String(div);
      snap(LN.writeDiv, 'write', `printf("%d", div) → écrit "${div}"`);
      n = n / div;
      snap(LN.divideN, 'assign', `n /= div → n = ${n}`);
      snap(LN.ifMore, 'check', `n > 1 ? ${n > 1 ? 'OUI → encore du taf, on met *' : 'non → fini, pas de *'}`);
      if (n > 1) {
        out += '*';
        snap(LN.writeStar, 'write', `printf("*") → séparateur`);
      }
    } else {
      div++;
      snap(LN.divInc, 'exec', `div++ → div = ${div}`);
    }
    snap(LN.outerW, 'check', `n > 1 ? ${n > 1 ? 'OUI, on continue' : 'non, on sort'}`);
  }

  out += '\n';
  snap(LN.finalNL, 'write', `printf("\\n") → fin`);
  return frames;
}

const EXAMPLES = [
  { label: '42', nbr: 42, argc: 2 },
  { label: '225225', nbr: 225225, argc: 2 },
  { label: '9539 (premier)', nbr: 9539, argc: 2 },
  { label: '8 (= 2×2×2)', nbr: 8, argc: 2 },
  { label: '1', nbr: 1, argc: 2 },
  { label: '0', nbr: 0, argc: 2 },
  { label: '(no arg)', nbr: 0, argc: 1 },
  { label: 'too many args', nbr: 0, argc: 3 },
];

let frames = [], cur = 0, playing = false, playTimer = null;

function renderExamples() {
  const el = document.getElementById('examples');
  el.innerHTML = EXAMPLES.map((e, idx) =>
    `<button class="ex-chip ${idx === 0 ? 'active' : ''}" data-idx="${idx}">${e.label}</button>`).join('');
  el.querySelectorAll('.ex-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      el.querySelectorAll('.ex-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      loadExample(EXAMPLES[parseInt(chip.dataset.idx)]);
    });
  });
}

function renderCode() {
  document.getElementById('code-body').innerHTML = CODE.map((html, idx) =>
    `<div class="code-line" data-line="${idx + 1}">${html || '&nbsp;'}</div>`).join('');
}

function renderFrame(f) {
  document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
  const line = document.querySelector(`.code-line[data-line="${f.line}"]`);
  if (line) { line.classList.add('active'); line.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  setVar('v-argc', f.vars.argc);
  setVar('v-n', f.vars.n);
  setVar('v-div', f.vars.div);
  document.getElementById('out-text').textContent = f.out ? f.out.replace(/\n/g, '⏎') : '—';
  document.getElementById('desc-tag').textContent = f.tag;
  document.getElementById('desc-text').textContent = f.desc;
  document.getElementById('step-n').textContent = cur + 1;
  document.getElementById('step-total').textContent = frames.length;
  document.getElementById('btn-prev').disabled = cur === 0;
  document.getElementById('btn-next').disabled = cur >= frames.length - 1;
}

function setVar(id, val) {
  const el = document.getElementById(id);
  if (val === null || val === undefined) { el.textContent = '-'; el.classList.add('null'); }
  else { el.textContent = val; el.classList.remove('null'); }
}

function loadExample(ex) {
  frames = genFrames(ex.nbr, ex.argc);
  cur = 0;
  stopPlay();
  renderFrame(frames[0]);
}

function next() { if (cur < frames.length - 1) { cur++; renderFrame(frames[cur]); } else stopPlay(); }
function prev() { if (cur > 0) { cur--; renderFrame(frames[cur]); } }
function reset() { stopPlay(); cur = 0; renderFrame(frames[0]); }
function startPlay() {
  if (cur >= frames.length - 1) cur = 0;
  playing = true;
  document.getElementById('btn-play').textContent = '⏸ pause';
  const speed = 2000 - parseInt(document.getElementById('speed').value);
  playTimer = setInterval(() => { if (cur < frames.length - 1) next(); else stopPlay(); }, speed);
}
function stopPlay() {
  playing = false;
  document.getElementById('btn-play').textContent = '▶ play';
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
}

document.getElementById('btn-next').addEventListener('click', () => { stopPlay(); next(); });
document.getElementById('btn-prev').addEventListener('click', () => { stopPlay(); prev(); });
document.getElementById('btn-reset').addEventListener('click', reset);
document.getElementById('btn-play').addEventListener('click', () => { if (playing) stopPlay(); else startPlay(); });
document.getElementById('speed').addEventListener('input', () => { if (playing) { stopPlay(); startPlay(); } });
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { stopPlay(); next(); }
  else if (e.key === 'ArrowLeft') { stopPlay(); prev(); }
  else if (e.key === ' ') { e.preventDefault(); if (playing) stopPlay(); else startPlay(); }
});
window.addEventListener('scroll', () => {
  const pct = (scrollY / (document.body.scrollHeight - innerHeight)) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
});
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.08 });
document.querySelectorAll('.fade').forEach(el => io.observe(el));

renderCode();
renderExamples();
loadExample(EXAMPLES[0]);
</script>

</body>
</html>
