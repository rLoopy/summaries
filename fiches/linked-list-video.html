<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linked lists — la vidéo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&family=Patrick+Hand&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0f0e1a;
  color: #f0e9d8;
  font-family: 'Patrick Hand', cursive;
  min-height: 100vh;
  overflow: hidden;
}

.video {
  width: 100vw;
  height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 30px 40px 70px 40px;
}

.scene-title {
  font-family: 'Kalam', cursive;
  font-size: 38px;
  color: #ffe96b;
  text-align: center;
  margin-bottom: 20px;
  min-height: 50px;
  opacity: 0;
  transform: translateY(-20px);
  transition: all 0.8s ease;
}
.scene-title.in { opacity: 1; transform: translateY(0); }

.main {
  flex: 1;
  display: flex;
  gap: 30px;
  min-height: 0;
}

.stage-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  min-height: 0;
}

.stage {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.code-panel {
  width: 440px;
  background: #1a1825;
  border: 2px solid #2a2833;
  border-radius: 12px;
  padding: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: #c0b3e0;
  overflow: hidden;
  opacity: 0;
  transition: opacity 0.6s ease;
  display: flex;
  flex-direction: column;
}
.code-panel.in { opacity: 1; }
.code-panel.hidden { display: none; }

.code-panel .code-title {
  font-family: 'Kalam', cursive;
  font-size: 14px;
  color: #79b8d8;
  letter-spacing: 2px;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px dashed #2a2833;
}

.code-panel pre {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13.5px;
  line-height: 1.7;
  white-space: pre;
  overflow-x: auto;
  color: #8f89a6;
}

.code-panel .line {
  display: block;
  padding: 0 8px;
  border-radius: 4px;
  transition: all 0.4s ease;
}
.code-panel .line.hl {
  background: rgba(255, 233, 107, 0.15);
  color: #ffe96b;
  font-weight: 700;
  box-shadow: inset 3px 0 0 #ffe96b;
}

.code-panel .kw { color: #ff9f7a; }
.code-panel .fn { color: #79b8d8; }
.code-panel .type { color: #9dd6a8; }
.code-panel .str { color: #ffe96b; }
.code-panel .com { color: #5c5a75; font-style: italic; }
.code-panel .num { color: #c9a6ff; }

.caption {
  font-family: 'Patrick Hand', cursive;
  font-size: 22px;
  color: #f0e9d8;
  text-align: center;
  max-width: 1000px;
  line-height: 1.55;
  margin: 20px auto 0 auto;
  min-height: 70px;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.8s ease;
}
.caption.in { opacity: 1; transform: translateY(0); }

.caption b { color: #ff9f7a; }
.caption code { font-family: 'JetBrains Mono', monospace; background: #2a2833; color: #ffb380; padding: 2px 8px; border-radius: 4px; font-size: 19px; }
.caption .hl { background: #ffe96b; color: #0f0e1a; padding: 2px 6px; border-radius: 3px; font-weight: 700; }

/* Boxes (nodes) */
.box {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 90px;
  height: 70px;
  background: #2a2833;
  border: 3px solid #ff9f7a;
  border-radius: 12px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 24px;
  color: #f0e9d8;
  box-shadow: 4px 4px 0 #c0b3e0;
  opacity: 0;
  transform: scale(0.5);
  transition: all 0.6s ease;
}
.box.in { opacity: 1; transform: scale(1); }
.box.fade { opacity: 0.2; filter: grayscale(1); }
.box.highlight {
  background: #ffe96b;
  color: #0f0e1a;
  border-color: #ffe96b;
  transform: scale(1.1);
}

.box .label {
  font-family: 'Caveat', cursive;
  font-size: 12px;
  color: #5c5a75;
  font-weight: 400;
  margin-top: 2px;
}

.arrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 32px;
  color: #c0b3e0;
  margin: 0 6px;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.arrow.in { opacity: 1; }

.null-marker {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  color: #5c5a75;
  font-style: italic;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.null-marker.in { opacity: 1; }

.row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  flex-wrap: wrap;
}

.head-label {
  position: absolute;
  font-family: 'Kalam', cursive;
  font-weight: 700;
  font-size: 24px;
  color: #9dd6a8;
  opacity: 0;
  transition: all 0.6s ease;
}
.head-label.in { opacity: 1; }

.head-arrow {
  position: absolute;
  font-size: 32px;
  color: #9dd6a8;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.head-arrow.in { opacity: 1; }

.struct-box {
  background: #2a2833;
  border: 3px solid #79b8d8;
  border-radius: 12px;
  padding: 20px 28px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  color: #f0e9d8;
  box-shadow: 5px 5px 0 #79b8d8;
  opacity: 0;
  transform: scale(0.7);
  transition: all 0.7s ease;
  text-align: left;
}
.struct-box.in { opacity: 1; transform: scale(1); }
.struct-box .field {
  padding: 5px 0;
  border-bottom: 1px dashed rgba(255,255,255,0.1);
}
.struct-box .field:last-child { border-bottom: none; }
.struct-box .field .kw { color: #a5d8a8; }
.struct-box .field .name { color: #ffe96b; }
.struct-box .field .note { color: #5c5a75; font-size: 14px; font-family: 'Caveat', cursive; font-style: italic; margin-left: 10px; }

.big-label {
  font-family: 'Caveat', cursive;
  font-size: 40px;
  color: #ffe96b;
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.6s ease;
  text-align: center;
  line-height: 1.4;
}
.big-label.in { opacity: 1; transform: scale(1); }

.heap-zone {
  background: rgba(157, 214, 168, 0.1);
  border: 2px dashed #9dd6a8;
  border-radius: 12px;
  padding: 25px 35px;
  position: relative;
  opacity: 0;
  transition: all 0.6s ease;
}
.heap-zone.in { opacity: 1; }
.heap-zone::before {
  content: "HEAP";
  position: absolute;
  top: -12px;
  left: 16px;
  background: #0f0e1a;
  color: #9dd6a8;
  padding: 0 10px;
  font-family: 'Kalam', cursive;
  font-size: 14px;
  letter-spacing: 2px;
}

.progress {
  position: fixed;
  bottom: 0;
  left: 0;
  height: 4px;
  background: #ffe96b;
  transition: width 0.2s linear;
  z-index: 100;
}

.controls {
  position: fixed;
  bottom: 14px;
  right: 14px;
  display: flex;
  gap: 8px;
  z-index: 100;
}
.controls button {
  font-family: 'Kalam', cursive;
  font-weight: 700;
  font-size: 14px;
  background: #2a2833;
  color: #f0e9d8;
  border: 2px solid #f0e9d8;
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.controls button:hover { background: #ffe96b; color: #0f0e1a; }
.controls button:active { transform: translateY(1px); }

.scene-counter {
  position: fixed;
  bottom: 18px;
  left: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: #5c5a75;
  z-index: 100;
}

.keyhint {
  position: fixed;
  bottom: 42px;
  left: 20px;
  font-family: 'Caveat', cursive;
  font-size: 13px;
  color: #3a3849;
  z-index: 100;
}
</style>
</head>
<body>

<div class="video">
  <div class="scene-title" id="title">Linked lists</div>
  <div class="main">
    <div class="stage-wrap">
      <div class="stage" id="stage"></div>
    </div>
    <div class="code-panel hidden" id="code">
      <div class="code-title" id="code-title">CODE</div>
      <pre id="code-body"></pre>
    </div>
  </div>
  <div class="caption" id="caption">La vidéo démarre...</div>
</div>

<div class="progress" id="progress"></div>
<div class="scene-counter" id="counter">scène 1 / ?</div>
<div class="keyhint">← prev · space pause · → next</div>
<div class="controls">
  <button id="btn-prev">⏮ prev</button>
  <button id="btn-pause">⏸ pause</button>
  <button id="btn-next">⏭ next</button>
  <button id="btn-replay">↺ replay</button>
</div>

<script>
// Helper to build a code panel from HTML (with highlight lines)
function code(title, html) {
  return { title, html };
}

const STRUCT_CODE = code("push_swap.h", `<span class="kw">typedef struct</span> <span class="type">s_stack</span>
{
  <span class="kw">int</span>              <span class="fn">val</span>;
  <span class="kw">struct</span> <span class="type">s_stack</span>  *<span class="fn">next</span>;
} <span class="type">t_stack</span>;`);

const NEW_CODE_FULL = `<span class="type">t_stack</span> *<span class="fn">stack_new</span>(<span class="kw">int</span> val)
{
  <span class="type">t_stack</span> *node;

  node = <span class="fn">malloc</span>(<span class="kw">sizeof</span>(*node));
  <span class="kw">if</span> (!node)
    <span class="kw">return</span> (<span class="num">NULL</span>);
  node-&gt;val = val;
  node-&gt;next = <span class="num">NULL</span>;
  <span class="kw">return</span> (node);
}`;

// Wrap lines with .line class, highlighting the ones specified
function wrapLines(src, hlLines = []) {
  return src.split('\n').map((ln, i) => {
    const isHl = hlLines.includes(i + 1);
    return `<span class="line${isHl ? ' hl' : ''}">${ln || ' '}</span>`;
  }).join('\n');
}

const SCENES = [
  // 1. Title
  {
    dur: 6000,
    title: "Linked lists",
    render: (stage) => {
      stage.innerHTML = '<div class="big-label" id="e1">✦ la vidéo ✦<br><span style="font-size:24px; color:#c0b3e0;">comprendre ce que fait stack_new</span></div>';
    },
    activate: () => setTimeout(() => document.getElementById('e1')?.classList.add('in'), 100),
    caption: "On va piger les <b>linked lists</b> visuellement, et voir <b>quel bout de code</b> fait quoi.",
    code: null
  },

  // 2. Problem : multiple boxes
  {
    dur: 7000,
    title: "Le problème : stocker plusieurs valeurs",
    render: (stage) => {
      stage.innerHTML = `
        <div class="row" id="r1">
          <div class="box" data-d="0">3</div>
          <div class="box" data-d="400">1</div>
          <div class="box" data-d="800">4</div>
          <div class="box" data-d="1200">2</div>
        </div>`;
    },
    activate: () => {
      document.querySelectorAll('#r1 .box').forEach((b) => {
        setTimeout(() => b.classList.add('in'), parseInt(b.dataset.d));
      });
    },
    caption: "Imagine que tu as plusieurs nombres à stocker. <b>Chacun dans sa boîte</b> en mémoire.",
    code: null
  },

  // 3. Arrows
  {
    dur: 8000,
    title: "Les relier : les flèches",
    render: (stage) => {
      stage.innerHTML = `
        <div class="row">
          <div class="box in">3</div>
          <span class="arrow" data-d="400">→</span>
          <div class="box in">1</div>
          <span class="arrow" data-d="1200">→</span>
          <div class="box in">4</div>
          <span class="arrow" data-d="2000">→</span>
          <div class="box in">2</div>
        </div>`;
    },
    activate: () => {
      document.querySelectorAll('.arrow').forEach(a => {
        setTimeout(() => a.classList.add('in'), parseInt(a.dataset.d));
      });
    },
    caption: "Chaque boîte <b>pointe vers la suivante</b> via une flèche. C'est ça, une <span class='hl'>linked list</span>.",
    code: null
  },

  // 4. NULL marker
  {
    dur: 7500,
    title: "La fin : NULL",
    render: (stage) => {
      stage.innerHTML = `
        <div class="row">
          <div class="box in">3</div>
          <span class="arrow in">→</span>
          <div class="box in">1</div>
          <span class="arrow in">→</span>
          <div class="box in">4</div>
          <span class="arrow in">→</span>
          <div class="box in">2</div>
          <span class="arrow" id="last-arrow" data-d="400">→</span>
          <span class="null-marker" id="null-m" data-d="1000">NULL</span>
        </div>`;
    },
    activate: () => {
      setTimeout(() => document.getElementById('last-arrow')?.classList.add('in'), 400);
      setTimeout(() => document.getElementById('null-m')?.classList.add('in'), 1000);
    },
    caption: "La dernière boîte pointe vers <b>NULL</b> — le <span class='hl'>marqueur de fin</span>. Quand ton code rencontre NULL, il sait que la chaîne s'arrête.",
    code: null
  },

  // 5. Head
  {
    dur: 8500,
    title: "Le head — l'entrée de la chaîne",
    render: (stage) => {
      stage.innerHTML = `
        <div style="position:relative; padding-top:70px;">
          <div class="head-label" id="hl" style="top:0; left:20px;">head</div>
          <div class="head-arrow" id="ha" style="top:28px; left:45px;">↓</div>
          <div class="row">
            <div class="box in">3</div>
            <span class="arrow in">→</span>
            <div class="box in">1</div>
            <span class="arrow in">→</span>
            <div class="box in">4</div>
            <span class="arrow in">→</span>
            <div class="box in">2</div>
            <span class="arrow in">→</span>
            <span class="null-marker in">NULL</span>
          </div>
        </div>`;
    },
    activate: () => {
      setTimeout(() => document.getElementById('hl')?.classList.add('in'), 400);
      setTimeout(() => document.getElementById('ha')?.classList.add('in'), 1000);
    },
    caption: "Pour accéder à la chaîne il te faut <b>UN SEUL point d'entrée</b> : le <span class='hl'>head</span>. C'est un pointeur vers la 1ère boîte.",
    code: null
  },

  // 6. Losing head
  {
    dur: 9000,
    title: "Si tu perds le head...",
    render: (stage) => {
      stage.innerHTML = `
        <div style="position:relative; padding-top:70px;">
          <div class="head-label in" style="top:0; left:20px; text-decoration: line-through; color: #ff6b6b;">head ✗</div>
          <div class="row" id="faderow">
            <div class="box in">3</div>
            <span class="arrow in">→</span>
            <div class="box in">1</div>
            <span class="arrow in">→</span>
            <div class="box in">4</div>
            <span class="arrow in">→</span>
            <div class="box in">2</div>
            <span class="arrow in">→</span>
            <span class="null-marker in">NULL</span>
          </div>
        </div>`;
    },
    activate: () => {
      setTimeout(() => {
        document.querySelectorAll('#faderow .box').forEach((b, i) => {
          setTimeout(() => b.classList.add('fade'), i * 400);
        });
      }, 2500);
    },
    caption: "...<b>tu perds tout</b>. Les boîtes sont toujours en mémoire, mais tu n'as plus d'adresse pour y accéder. <span class='hl'>Memory leak définitif.</span>",
    code: null
  },

  // 7. Struct — WITH CODE PANEL
  {
    dur: 10000,
    title: "Chaque boîte = une struct",
    render: (stage) => {
      stage.innerHTML = `
        <div class="struct-box" id="sb">
          <div class="field"><span class="kw">typedef struct</span> s_stack</div>
          <div class="field" style="padding-left:20px;"><span class="kw">int</span> <span class="name">val</span>;<span class="note">// la valeur stockée</span></div>
          <div class="field" style="padding-left:20px;"><span class="kw">struct s_stack</span> *<span class="name">next</span>;<span class="note">// la flèche</span></div>
          <div class="field"><span class="kw">t_stack</span>;</div>
        </div>`;
    },
    activate: () => setTimeout(() => document.getElementById('sb')?.classList.add('in'), 400),
    caption: "En C, une boîte c'est une <b>struct</b> avec 2 champs : la <span class='hl'>valeur</span> et un <span class='hl'>pointeur vers la suivante</span>. Voilà le code exact →",
    code: { title: "push_swap.h", body: wrapLines(
`typedef struct s_stack
{
  int              val;
  struct s_stack  *next;
} t_stack;`, [3, 4]).replace(/typedef|struct|int/g, m => `<span class="kw">${m}</span>`)
       .replace(/s_stack|t_stack/g, m => `<span class="type">${m}</span>`)
       .replace(/val|next/g, m => `<span class="fn">${m}</span>`)
    }
  },

  // 8. stack_new — WITH CODE, line 4 highlighted (malloc)
  {
    dur: 11000,
    title: "stack_new(3) — étape 1 : malloc",
    render: (stage) => {
      stage.innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; gap:30px;">
          <div class="big-label in" style="font-size:30px;">stack_new(3)</div>
          <div class="heap-zone" id="hz">
            <div class="box" id="nb">
              <div>?</div>
              <div class="label">next: ?</div>
            </div>
          </div>
          <div style="font-family:'Patrick Hand',cursive; font-size:18px; color:#9dd6a8;">
            malloc a réservé une boîte <b>vide</b> sur le heap.
          </div>
        </div>`;
    },
    activate: () => {
      setTimeout(() => document.getElementById('hz')?.classList.add('in'), 500);
      setTimeout(() => document.getElementById('nb')?.classList.add('in'), 1200);
    },
    caption: "<code>malloc(sizeof(*node))</code> demande une boîte de la bonne taille sur le <b>heap</b>. Elle est là, mais <b>vide</b> (valeurs indéfinies).",
    code: { title: "stack.c — ligne 5", body: wrapLines(
`t_stack *stack_new(int val)
{
  t_stack *node;

  node = malloc(sizeof(*node));
  if (!node)
    return (NULL);
  node->val = val;
  node->next = NULL;
  return (node);
}`, [5]).replace(/malloc|sizeof|return|if/g, m => `<span class="kw">${m}</span>`)
       .replace(/\bint\b/g, '<span class="kw">int</span>')
       .replace(/t_stack/g, '<span class="type">t_stack</span>')
       .replace(/NULL/g, '<span class="num">NULL</span>')
       .replace(/stack_new/g, '<span class="fn">stack_new</span>')
    }
  },

  // 9. stack_new step 2: check null + write
  {
    dur: 11000,
    title: "stack_new(3) — étape 2 : remplir",
    render: (stage) => {
      stage.innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; gap:30px;">
          <div class="heap-zone in" style="padding:35px 45px;">
            <div class="box in" id="nb" style="transition: all 0.6s ease;">
              <div id="v">3</div>
              <div class="label" id="n">next: NULL</div>
            </div>
          </div>
          <div class="big-label in" style="font-size:22px; color:#9dd6a8;">
            val ← 3<br>next ← NULL
          </div>
        </div>`;
    },
    activate: () => {},
    caption: "On écrit <code>val = 3</code> et <code>next = NULL</code> dans la boîte. Puis on <b>retourne son adresse</b>.",
    code: { title: "stack.c — lignes 8-10", body: wrapLines(
`t_stack *stack_new(int val)
{
  t_stack *node;

  node = malloc(sizeof(*node));
  if (!node)
    return (NULL);
  node->val = val;
  node->next = NULL;
  return (node);
}`, [8, 9, 10]).replace(/malloc|sizeof|return|if/g, m => `<span class="kw">${m}</span>`)
       .replace(/\bint\b/g, '<span class="kw">int</span>')
       .replace(/t_stack/g, '<span class="type">t_stack</span>')
       .replace(/NULL/g, '<span class="num">NULL</span>')
       .replace(/stack_new/g, '<span class="fn">stack_new</span>')
    }
  },

  // 10. Heap survives
  {
    dur: 8500,
    title: "Le heap — la mémoire qui survit",
    render: (stage) => {
      stage.innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; gap:25px;">
          <div class="heap-zone in" style="padding:35px 45px;">
            <div class="box in">3</div>
          </div>
          <div class="big-label in" style="font-size:30px;">↑</div>
          <div style="font-family:'Patrick Hand',cursive; font-size:22px; color:#9dd6a8; text-align:center;">
            La fonction <code style="background:#2a2833;color:#ffb380;padding:2px 8px;border-radius:4px;">stack_new</code> est finie.<br>
            La boîte <b>est toujours là</b>.
          </div>
        </div>`;
    },
    activate: () => {},
    caption: "Contrairement au <b>stack</b> (variables locales qui meurent à la sortie de la fonction), le <span class='hl'>heap survit</span> tant que tu n'appelles pas <code>free()</code>.",
    code: null
  },

  // 11a. stack_add_bottom — cas 1 : pile vide
  {
    dur: 11000,
    title: "stack_add_bottom — cas 1 : pile vide",
    render: (stage) => {
      stage.innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; gap:30px;">
          <div style="display:flex; align-items:center; gap:20px;">
            <div style="font-family:'Kalam',cursive; font-size:22px; color:#c0b3e0;">*stack =</div>
            <div class="null-marker in" style="font-size:24px;">NULL</div>
          </div>
          <div class="big-label in" style="font-size:30px;">↓ stack_add_bottom(&stack, 3)</div>
          <div class="heap-zone in" style="padding:25px 35px;">
            <div class="box in">3</div>
          </div>
          <div style="font-family:'Patrick Hand',cursive; font-size:20px; color:#9dd6a8; text-align:center;">
            *stack pointe maintenant vers la nouvelle boîte.
          </div>
        </div>`;
    },
    activate: () => {},
    caption: "Si <code>*stack == NULL</code> (pile vide), on crée le node via <code>stack_new</code> et on fait <code>*stack = new</code>. <b>C'est le seul cas où on modifie *stack.</b>",
    code: { title: "stack_add_bottom (ton TROU B1+B2)", body: wrapLines(
`new = stack_new(val);
if (!new)
  return ;
if (!*stack)
{
  *stack = new;
  return ;
}
/* sinon : parcourir jusqu'à la fin */`, [4, 5, 6, 7, 8]).replace(/if|return/g, m => `<span class="kw">${m}</span>`)
       .replace(/\/\*.*?\*\//g, m => `<span class="com">${m}</span>`)
       .replace(/stack_new/g, '<span class="fn">stack_new</span>')
    }
  },

  // 11b. stack_add_bottom — cas 2 : parcourir jusqu'au bout
  {
    dur: 12000,
    title: "stack_add_bottom — cas 2 : pile non vide",
    render: (stage) => {
      stage.innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; gap:25px;">
          <div class="row" id="traverse">
            <div class="box highlight" id="t0">3</div>
            <span class="arrow in">→</span>
            <div class="box in" id="t1">1</div>
            <span class="arrow in">→</span>
            <div class="box in" id="t2">4</div>
            <span class="arrow in">→</span>
            <span class="null-marker in" id="tnull">NULL</span>
          </div>
          <div style="font-family:'Patrick Hand',cursive; font-size:18px; color:#c0b3e0;">
            cur marche jusqu'à <b>cur->next == NULL</b>
          </div>
          <div class="row" id="final" style="opacity:0; transition: opacity 0.8s ease;">
            <div class="box in">3</div>
            <span class="arrow in">→</span>
            <div class="box in">1</div>
            <span class="arrow in">→</span>
            <div class="box in">4</div>
            <span class="arrow in">→</span>
            <div class="box in" style="border-color:#9dd6a8;">7</div>
            <span class="arrow in">→</span>
            <span class="null-marker in">NULL</span>
          </div>
        </div>`;
    },
    activate: () => {
      const ids = ['t0', 't1', 't2'];
      ids.forEach((id, i) => {
        setTimeout(() => {
          ids.forEach(x => document.getElementById(x)?.classList.remove('highlight'));
          document.getElementById(id)?.classList.add('highlight');
        }, i * 2000);
      });
      setTimeout(() => {
        document.getElementById('final').style.opacity = '1';
      }, 7000);
    },
    caption: "Sinon on parcourt avec <code>cur = *stack</code> jusqu'à ce que <code>cur->next == NULL</code>, puis on attache : <code>cur->next = new</code>.",
    code: { title: "stack_add_bottom (ton TROU B3+B4)", body: wrapLines(
`cur = *stack;
while (cur->next)
  cur = cur->next;
cur->next = new;`, [1, 2, 3, 4]).replace(/while/g, m => `<span class="kw">${m}</span>`)
    }
  },

  // 11. Building a chain — WITH CODE showing build_stack
  {
    dur: 10000,
    title: "Construire une chaîne",
    render: (stage) => {
      stage.innerHTML = `
        <div class="row" id="build">
          <div class="head-label in" style="position:static; margin-right: 15px;">head →</div>
          <div class="box" data-d="0">3</div>
          <span class="arrow" data-d="1000">→</span>
          <div class="box" data-d="1800">1</div>
          <span class="arrow" data-d="2800">→</span>
          <div class="box" data-d="3600">4</div>
          <span class="arrow" data-d="4600">→</span>
          <div class="box" data-d="5400">2</div>
          <span class="arrow" data-d="6400">→</span>
          <span class="null-marker" data-d="7000">NULL</span>
        </div>`;
    },
    activate: () => {
      document.querySelectorAll('#build [data-d]').forEach(el => {
        setTimeout(() => el.classList.add('in'), parseInt(el.dataset.d));
      });
    },
    caption: "<code>build_stack</code> boucle sur <code>values</code> et appelle <code>stack_add_bottom</code> avec chaque <code>values[i]</code>. Pas besoin de toucher à <code>stack_new</code> ici — c'est <code>stack_add_bottom</code> qui l'appelle en interne.",
    code: { title: "build_stack (ton TROU E)", body: wrapLines(
`stack = NULL;
i = 0;
while (i < n)
{
  stack_add_bottom(&stack, values[i]);
  i++;
}
return (stack);`, [1, 5]).replace(/while|return/g, m => `<span class="kw">${m}</span>`)
       .replace(/NULL/g, '<span class="num">NULL</span>')
       .replace(/stack_add_bottom/g, '<span class="fn">stack_add_bottom</span>')
    }
  },

  // 12. Walking — WITH CODE showing while(cur) cur = cur->next
  {
    dur: 10000,
    title: "Parcourir la chaîne",
    render: (stage) => {
      stage.innerHTML = `
        <div class="row" id="walker">
          <div class="box highlight" id="b0">3</div>
          <span class="arrow in">→</span>
          <div class="box in" id="b1">1</div>
          <span class="arrow in">→</span>
          <div class="box in" id="b2">4</div>
          <span class="arrow in">→</span>
          <div class="box in" id="b3">2</div>
          <span class="arrow in">→</span>
          <span class="null-marker in">NULL</span>
        </div>`;
    },
    activate: () => {
      const ids = ['b0', 'b1', 'b2', 'b3'];
      ids.forEach((id, i) => {
        setTimeout(() => {
          ids.forEach(x => document.getElementById(x)?.classList.remove('highlight'));
          document.getElementById(id)?.classList.add('highlight');
        }, i * 2000);
      });
    },
    caption: "Pour parcourir : pars du head, <b>suis next</b> à chaque étape jusqu'à NULL. Pattern universel des linked lists.",
    code: { title: "pattern de parcours", body: wrapLines(
`cur = head;
while (cur)
{
  // ... fais un truc avec cur->val
  cur = cur->next;
}`, [2, 5]).replace(/while/g, m => `<span class="kw">${m}</span>`)
       .replace(/\/\/.*$/gm, m => `<span class="com">${m}</span>`)
    }
  },

  // 13. Recap
  {
    dur: 8000,
    title: "C'est tout ce qu'il y a à savoir",
    render: (stage) => {
      stage.innerHTML = `
        <div class="big-label" id="e1" style="text-align:left;">
          ✓ boîte = struct (val + next)<br>
          ✓ chaîne via next<br>
          ✓ head = entrée unique<br>
          ✓ NULL = fin de chaîne<br>
          ✓ heap = mémoire qui survit
        </div>`;
    },
    activate: () => setTimeout(() => document.getElementById('e1')?.classList.add('in'), 300),
    caption: "Les <b>4 autres fonctions</b> (add_bottom, size, free, build) ne font qu'appliquer ces 5 idées. À ton tour de coder.",
    code: null
  },
];

let currentScene = 0;
let timer = null;
let paused = false;
let startTime = 0;
let remainingTime = 0;

const stage = document.getElementById('stage');
const titleEl = document.getElementById('title');
const captionEl = document.getElementById('caption');
const progressEl = document.getElementById('progress');
const counterEl = document.getElementById('counter');
const codeEl = document.getElementById('code');
const codeTitleEl = document.getElementById('code-title');
const codeBodyEl = document.getElementById('code-body');

function playScene(idx) {
  if (idx >= SCENES.length) { idx = 0; }
  if (idx < 0) { idx = SCENES.length - 1; }
  currentScene = idx;
  const s = SCENES[idx];

  titleEl.classList.remove('in');
  captionEl.classList.remove('in');
  codeEl.classList.remove('in');

  setTimeout(() => {
    titleEl.textContent = s.title;
    captionEl.innerHTML = s.caption;
    s.render(stage);

    // Code panel
    if (s.code) {
      codeEl.classList.remove('hidden');
      codeTitleEl.textContent = s.code.title;
      codeBodyEl.innerHTML = s.code.body;
    } else {
      codeEl.classList.add('hidden');
    }

    setTimeout(() => {
      titleEl.classList.add('in');
      s.activate();
      setTimeout(() => {
        captionEl.classList.add('in');
        if (s.code) codeEl.classList.add('in');
      }, 300);
    }, 100);

    counterEl.textContent = `scène ${idx + 1} / ${SCENES.length}`;
    progressEl.style.width = ((idx + 1) / SCENES.length * 100) + '%';

    startTime = Date.now();
    remainingTime = s.dur;
    if (!paused) scheduleNext(s.dur);
  }, 500);
}

function scheduleNext(delay) {
  if (timer) clearTimeout(timer);
  timer = setTimeout(() => playScene(currentScene + 1), delay);
}

function togglePause() {
  paused = !paused;
  const btn = document.getElementById('btn-pause');
  btn.textContent = paused ? '▶ reprendre' : '⏸ pause';
  if (paused) {
    if (timer) clearTimeout(timer);
    remainingTime -= (Date.now() - startTime);
  } else {
    startTime = Date.now();
    scheduleNext(Math.max(remainingTime, 500));
  }
}

function replay() {
  paused = false;
  document.getElementById('btn-pause').textContent = '⏸ pause';
  if (timer) clearTimeout(timer);
  playScene(0);
}

function prev() {
  if (timer) clearTimeout(timer);
  playScene(currentScene - 1);
}

function next() {
  if (timer) clearTimeout(timer);
  playScene(currentScene + 1);
}

document.getElementById('btn-pause').addEventListener('click', togglePause);
document.getElementById('btn-replay').addEventListener('click', replay);
document.getElementById('btn-prev').addEventListener('click', prev);
document.getElementById('btn-next').addEventListener('click', next);

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); prev(); }
  if (e.code === 'ArrowRight') { e.preventDefault(); next(); }
  if (e.code === 'KeyR') { e.preventDefault(); replay(); }
});

playScene(0);
</script>
